---
- name: Resolve the scoped source connection
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add only the frozen source connection
      ansible.builtin.add_host:
        name: samurai_consistency_source
        ansible_host: "{{ consistency_host }}"
        ansible_connection: ssh

- name: Governed source filesystem consistency
  hosts: samurai_consistency_source
  gather_facts: false
  become: true
  tasks:
    - name: Select a supported source Python without changing the system interpreter
      ansible.builtin.raw: |
        for candidate in /usr/bin/python3.11 /usr/bin/python3.9; do
          if [ -x "$candidate" ] && "$candidate" -c 'import sys; assert sys.version_info >= (3, 9)' >/dev/null 2>&1; then
            printf '%s\n' "$candidate"
            exit 0
          fi
        done
        exit 1
      register: consistency_python
      changed_when: false
      failed_when: consistency_python.rc != 0 or consistency_python.stdout | trim not in ['/usr/bin/python3.11', '/usr/bin/python3.9']
    - name: Pin the verified source Python for this job
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ consistency_python.stdout | trim }}"
    - name: Require the frozen source command
      ansible.builtin.assert:
        that:
          - samurai_consistency_command.scope.organization_id | int > 0
          - samurai_consistency_command.scope.execution_id | int > 0
          - samurai_consistency_command.scope.generation | int > 0
          - samurai_consistency_command.parameters.volumes | length > 0
    - name: Apply source fencing and observe its result
      samurai_consistency:
        command: "{{ samurai_consistency_command }}"
      register: consistency_result
    - name: Publish measured source consistency
      ansible.builtin.set_stats:
        data:
          samurai_consistency_observation: "{{ consistency_result.consistency_observation }}"
        aggregate: false
