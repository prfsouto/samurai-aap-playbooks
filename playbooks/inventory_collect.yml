---
# ============================================================================
# Single-stage playbook used by the AAP job template "samurai_inventory_collect"
# (Fase 1 Onda 2 — Server Mapping, RFC-004 §16.4/§16.5). It captures the raw
# inventory (Layer-1) of an EXISTING host: gather_facts (setup) + package_facts,
# assembled into one facts document, hashed and PUT to a presigned S3 URL for
# the engine's Layer-2 transformers to derive OBOM/blueprint/baseline from.
#
# The action is READ-ONLY on the collected host — it never mutates it, so the
# change gate (I2) does not apply (RFC-004 §16.7 read-only class). The upload
# is a plain HTTPS PUT (ansible.builtin.uri) to a presigned URL the engine
# minted for this run (model decided 2026-07-10, RFC-004 §16.4/§16.5 —
# presigned-URL model). I10 stays intact and goes further than before: the AAP
# carries NO AWS credential at all — the signed URL already embeds the
# (time-boxed, single-object) write authorization.
#
# Inputs (extra_vars from the control plane):
#   target_host                IP/hostname of the existing host to collect (required)
#   target_connection_type     transport to the host: `ssh` (default) or `winrm`
#   target_winrm_cert_validation  WinRM TLS policy, only sent on a WinRM launch
#   target_port                connection port of that host (optional, defaults to
#                              22 — the engine always sends it; the default only
#                              covers a manual/legacy launch)
#   samurai_execution_id       correlation id, stamped everywhere (required, I8)
#   organization_id            tenant scope, carried in the document (required)
#   facts_s3_presigned_put_url presigned S3 PUT URL for this run's inbox object (required)
#   facts_s3_put_headers       the exact HTTP headers (SSE-KMS directives) the
#                              URL was signed for — passed through as-is (required)
# ============================================================================

- name: "SamurAI :: inventory_collect :: validate inputs + register target host"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "[inventory_collect] Validate required collection inputs are present"
      ansible.builtin.assert:
        that:
          - samurai_execution_id | default('') | length > 0
          - target_host | default('') | length > 0
          # organization_id is an int on the wire (the engine's launch_collection
          # passes org_id, the FastAPI/SQLAlchemy PK, unconverted) — | length on
          # a bare int raises "object of type 'int' has no len()" and fails this
          # task before the host is ever touched (confirmed against a real failed
          # AAP job). | string coerces both the int case and the absent case
          # (default('') already yields a str) so | length is always applied to
          # a string.
          - organization_id | default('') | string | length > 0
          - facts_s3_presigned_put_url | default('') | length > 0
          - facts_s3_put_headers | default({}) | length > 0
        # The presigned URL's querystring carries the signature — echoed only
        # as set/MISSING here, the same care the ephemeral ingest token had
        # under the earlier POST design. facts_s3_put_headers carries no
        # secret (just the SSE-KMS directives) and is echoed in full.
        fail_msg: >-
          inventory_collect requires samurai_execution_id, target_host,
          organization_id, facts_s3_presigned_put_url and facts_s3_put_headers
          (got execution_id='{{ samurai_execution_id | default('') }}',
          target_host='{{ target_host | default('') }}',
          organization_id='{{ organization_id | default('') }}',
          facts_s3_presigned_put_url={{ 'set' if (facts_s3_presigned_put_url | default('') | length > 0) else 'MISSING' }},
          facts_s3_put_headers={{ facts_s3_put_headers | default({}) }}).
      tags: [inventory_collect]

    - name: "[inventory_collect] Register the operator-supplied target host (in-memory inventory)"
      ansible.builtin.add_host:
        name: "{{ target_host }}"
        groups: samurai_collect_target
        # O TRANSPORTE que leva a credencial até o alvo. Uma credencial de conta
        # Windows (`windows_local_admin`, `domain_account`) autentica por WinRM,
        # não por OpenSSH: sem isto a coleta pedia banner OpenSSH numa porta que
        # só fala WSMan e morria em timeout. default('ssh') preserva byte a byte
        # todo chamador anterior.
        ansible_connection: "{{ target_connection_type | default('ssh') }}"
        # NTLM é a autenticação de conta LOCAL do Windows por WinRM (kerberos
        # exige domínio). Só viaja quando o transporte é WinRM — no SSH o
        # `omit` mantém a task idêntica à de antes.
        ansible_winrm_transport: >-
          {{ 'ntlm' if (target_connection_type | default('ssh')) == 'winrm'
             else omit }}
        # A política TLS do WinRM, que viaja COM o transporte dono dela. Um
        # Windows Server brownfield publica o WinRM HTTPS com o certificado
        # self-signed que ele mesmo gera, então a validação de cadeia falha por
        # construção (medido no STG no Managed Server 22: a 5986 respondeu na
        # hora e o handshake morreu em CERTIFICATE_VERIFY_FAILED). O canal segue
        # cifrado e o NTLM segue autenticando; o que se dispensa é confiar numa
        # CA que nenhuma máquina cliente registrou. No SSH o `omit` mantém a
        # task idêntica — nada de afrouxar TLS global no `ansible.cfg`.
        ansible_winrm_server_cert_validation: >-
          {{ target_winrm_cert_validation | default('ignore')
             if (target_connection_type | default('ssh')) == 'winrm'
             else omit }}
        # A porta da conexão, resolvida junto com o transporte (#1671): a do
        # host credential no SSH, 5986 no WinRM. Ela NÃO pode viajar na Machine
        # credential — `port` não é input dela — então o host em memória é o
        # único lugar onde dá pra setar. Sem isto o play disca 22: um lab NAT'd
        # publicado na 8513 caiu num sshd diferente do mesmo IP público e falhou
        # como "Permission denied" (job real 210 no STG), que se lê como senha
        # errada. default(22) mantém funcionando quem omite target_port.
        ansible_port: "{{ target_port | default(22) }}"
        # O shell que o alvo fala (OSA #2809, fundação Windows): o Ansible
        # precisa saber que o shell padrão é PowerShell para usar os wrappers
        # certos — vale tanto pro Windows por OpenSSH quanto por WinRM.
        # default('sh') preserva todo chamador anterior byte a byte.
        ansible_shell_type: "{{ target_shell_type | default('sh') }}"
        # A CONTA que existe no alvo. Numa máquina do cliente é a da credencial
        # governada, e o omitido aqui deixa a Machine credential mandar — é o
        # comportamento de sempre. Numa CANDIDATA a conta é outra: ela nasce da
        # imagem-base da plataforma e herda a conta DELA (`ubuntu`, `ec2-user`,
        # `Administrator`), que é o que o provisionamento autorizou a chave a
        # usar. Sem poder dizer isso aqui, a coleta discorda do provisionamento e
        # o alvo responde "Permission denied" com o SSH funcionando — medido no
        # STG, validação 102 (`samurai@…: Permission denied`).
        ansible_user: "{{ target_login_user | default(omit) }}"
      changed_when: false
      tags: [inventory_collect]

- name: "SamurAI :: inventory_collect :: collect facts (read-only) → presigned S3 PUT"
  hosts: samurai_collect_target
  # gather_facts IS half the collection — the setup module captures OS, kernel,
  # hardware, mounts and interfaces; package_facts (in the role) adds packages.
  #
  # Ele roda EXPLICITAMENTE, e não pelo automático do play, porque o gather
  # automático acontece antes de qualquer task — inclusive antes de uma espera —
  # e não há onde provar que o alvo já aceita conexão. Uma candidata recém
  # provisionada ainda está subindo: no Linux o sshd atende em segundos, no
  # Windows o EC2Launch leva minutos, e a coleta batia em UNREACHABLE tratando
  # "instância criada" como "máquina alcançável" (medido no STG, validação 110:
  # instância às 12:49:55, coleta às 12:50:54, timeout em 16s).
  gather_facts: false
  tasks:
    - name: "[inventory_collect] Wait until the target actually serves SSH"
      # Só no transporte SSH: um alvo WinRM nunca emite banner OpenSSH, e
      # esperar por ele queimava o timeout inteiro antes de tocar na máquina.
      when: (target_connection_type | default('ssh')) == 'ssh'
      # Espera do lado do CONTROLADOR, olhando a porta e o banner — de propósito.
      # `wait_for_connection` executa `ansible.legacy.ping`, que precisa de Python
      # no alvo e portanto nunca responde numa candidata Windows; esperar o banner
      # OpenSSH prova que o serviço atende sem exigir nada de dentro da máquina, e
      # vale igual para as quatro famílias.
      #
      # O alvo vem de `target_host`/`target_port` — as MESMAS variáveis que o
      # add_host usou — e não de `ansible_host`/`ansible_port`: sob `delegate_to`
      # as variáveis de conexão passam a ser as do host DELEGADO, então a espera
      # ficava olhando o SSH do próprio controlador e queimava o timeout inteiro
      # sem nunca tocar na máquina (medido no STG, job AAP 227: "Timeout when
      # waiting for search string OpenSSH in localhost:22", 600s perdidos).
      ansible.builtin.wait_for:
        host: "{{ target_host }}"
        port: "{{ target_port | default(22) | int }}"
        search_regex: "OpenSSH"
        timeout: "{{ inventory_collect_connection_timeout | default(600) | int }}"
        sleep: 10
      delegate_to: localhost
      tags: [inventory_collect]

    - name: "[inventory_collect] Wait until the target's WinRM listener answers"
      # Readiness MÍNIMA compatível com WinRM: porta aberta, sem banner. Quem
      # prova a conexão de verdade é o connection plugin no gather logo abaixo —
      # aqui só se espera a máquina subir (no Windows o boot leva minutos).
      ansible.builtin.wait_for:
        host: "{{ target_host }}"
        port: "{{ target_port | default(5986) | int }}"
        timeout: "{{ inventory_collect_connection_timeout | default(600) | int }}"
        sleep: 10
      delegate_to: localhost
      when: (target_connection_type | default('ssh')) == 'winrm'
      tags: [inventory_collect]

    - name: "[inventory_collect] Gather facts once the target is reachable"
      ansible.builtin.setup:
      tags: [inventory_collect]

    - name: "Run the inventory_collect role"
      ansible.builtin.import_role:
        name: inventory_collect
      tags: [inventory_collect]
