---
# ============================================================================
# Sample extra-vars for tomcat_update_with_evidence.yml
# ----------------------------------------------------------------------------
# Pass these through an AAP Job Template survey or --extra-vars.
# In the normal remediation flow HOSTNAMES + ACTION + CATALINA_HOME +
# SERVICE_NAME + TARGET_VERSION are sent (and TOMCAT_ARTIFACT_URL +
# TOMCAT_ARTIFACT_SHA512 when ACTION=Apply).
# ============================================================================

# --- required (always) -------------------------------------------------------
# Target hosts. The SamurAI Shield engine sends them space-separated;
# commas are also accepted.
HOSTNAMES: "vm1-samurai vm2-samurai"

# The absolute path the target's systemd service references TODAY — a
# symlink, or (the common case for a hand-installed Tomcat) a real,
# version-named directory. The playbook detects which on its own; never
# guessed, always required.
CATALINA_HOME: "/opt/apache-tomcat-9.0.50"

# The systemd unit that fronts this Tomcat.
SERVICE_NAME: "tomcat"

# The exact version to converge on (never "latest" — the scope can never be
# guessed). Check reports whether this differs from what is installed;
# Apply converges on it.
TARGET_VERSION: "9.0.121"

# --- action -------------------------------------------------------------------
# Check = read-only. Reports the installed version vs TARGET_VERSION and a
#         services/ports baseline. Nothing is downloaded, nothing changes.
# Apply = downloads + verifies the artifact, stages the new version in a
#         sibling directory, migrates conf/ + custom webapps + extra jars
#         from the current install, cuts the stable indirection symlink
#         over to it, and restarts the service.
ACTION: "Check"

# --- required only when ACTION=Apply -------------------------------------------
# TOMCAT_ARTIFACT_URL: "https://archive.apache.org/dist/tomcat/tomcat-9/v9.0.121/bin/apache-tomcat-9.0.121.tar.gz"
# TOMCAT_ARTIFACT_SHA512: "<sha512 of the exact tar.gz above — never installed without it>"

# --- optional (shown with their defaults) -----------------------------------
# TOMCAT_STOCK_WEBAPPS: "ROOT,docs,examples,host-manager,manager"
#                                     # csv of Tomcat's own bundled webapps — never
#                                     # treated as a customization to migrate.
# SERIAL_BATCH: 1                     # hosts patched at a time
# SERVICE_CHECK: "on"                 # on | off. Records running services + listening TCP
#                                     # ports before the change; after Apply (and the Tomcat
#                                     # restart) starts again whatever did not come back. What
#                                     # stays down is a warning with the start error (job not
#                                     # failed). Same contract as the OS update playbooks.
# SERVICE_SETTLE_SECONDS: 120         # max wait for services to come back by themselves
# SERVICE_IGNORE: ""                  # csv of service names (trailing * = prefix) or TCP ports
# EVIDENCE_BASE_DIR: "/var/tmp/samurai-shield/tomcat-update"
