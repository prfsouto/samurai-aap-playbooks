---
# ============================================================================
# SamurAI Shield :: Linux apt update with evidence
# ----------------------------------------------------------------------------
# Controlled package update playbook for Debian-family Linux servers (Ubuntu,
# Debian), executed from Ansible Automation Platform (AAP). Mirrors the
# operational contract of linux_yum_update_with_evidence.yml — pre-checks,
# optional update, post-checks, structured evidence files and a JSON summary
# the SamurAI Shield control plane ingests from the AAP job stdout — adapting
# ONLY the technology (apt/dpkg instead of yum/dnf).
#
# #3037: this playbook exists because the Ubuntu remediation path used to live
# only in the AAP SCM mirror (oraex_ubuntu_security_only_update.yml) and
# depended on the host's `unattended-upgrade` service — a mechanism the host
# preparation may disable, and one this repo could neither review nor test.
# This playbook uses apt directly and never invokes unattended-upgrade.
#
# Stages:
#   1. Build dynamic in-memory inventory from HOSTNAMES (localhost play).
#   2. Run pre-check, optional update and post-check on each target host.
#      Fact gathering and the evidence directory run inside the rescue block,
#      so an unreachable or rejected host never stops the wave (#54). A host
#      that drops during the long update tasks, or whose summary.json cannot
#      be written, also ends `failed` without stopping the wave (#56).
#   3. Emit a consolidated samurai_shield_result JSON block on stdout.
#   4. Re-check hosts that were unreachable (graded unreachable in the PLAY
#      RECAP) and re-fail every host whose execution ended failed (#3037 C3,
#      moved out of stage 2 by #48).
#
# Extra-vars contract — see ansible/playbooks/README_linux_apt_update_with_evidence.md
# (same variables as the yum playbook: HOSTNAMES, ACTION=Check|Apply,
# UPDATE_MODE=all|security, EXCLUDE_PACKAGES, ALLOW_REBOOT, SERIAL_BATCH,
# EVIDENCE_BASE_DIR).
# ============================================================================

- name: "SamurAI :: apt-update :: build dynamic inventory from HOSTNAMES"
  hosts: localhost
  gather_facts: false
  vars:
    # Distinct internal names: a play var that references its own name
    # (`ACTION: "{{ ACTION | default('Check') }}"`) resolves to ITSELF when the
    # extra-var is absent and dies with "recursive loop detected in template".
    # Survey blanks arrive as '' (defined), so the fallback is
    # `(X | default('') | trim) or Y`, never `default(Y)`.
    samurai_hostnames_raw: "{{ HOSTNAMES | default('') | string | trim }}"
    samurai_action_raw: "{{ (ACTION | default('') | string | trim) or 'Check' }}"
    samurai_update_mode_raw: "{{ (UPDATE_MODE | default('') | string | trim) or 'all' }}"
  tasks:
    - name: "Validate HOSTNAMES is provided"
      ansible.builtin.fail:
        msg: "HOSTNAMES extra-var is required (single host, IP, or comma-separated list)."
      when: samurai_hostnames_raw == ''

    - name: "Validate ACTION is Check or Apply"
      ansible.builtin.fail:
        msg: "Invalid ACTION '{{ samurai_action_raw }}'. Allowed values: Check, Apply."
      when: samurai_action_raw not in ['Check', 'Apply']

    - name: "Validate UPDATE_MODE is all or security"
      ansible.builtin.fail:
        msg: "Invalid UPDATE_MODE '{{ samurai_update_mode_raw }}'. Allowed values: all, security."
      when: samurai_update_mode_raw not in ['all', 'security']

    - name: "Publish resolved run parameters as localhost facts"
      ansible.builtin.set_fact:
        samurai_action: "{{ samurai_action_raw }}"
        samurai_update_mode: "{{ samurai_update_mode_raw }}"

    - name: "Parse HOSTNAMES into a list (tolerant: space OR comma) — #1418"
      ansible.builtin.set_fact:
        samurai_target_hosts: >-
          {{ samurai_hostnames_raw.replace(',', ' ').split() | reject('equalto', '') | list }}

    - name: "Add hosts to dynamic group samurai_apt_update_targets"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: samurai_apt_update_targets
      loop: "{{ samurai_target_hosts }}"
      changed_when: false

    - name: "Show resolved target hosts"
      ansible.builtin.debug:
        msg: "Targets: {{ samurai_target_hosts | join(', ') }} | ACTION={{ samurai_action }} | UPDATE_MODE={{ samurai_update_mode }}"


- name: "SamurAI :: apt-update :: pre-check, update and post-check"
  hosts: samurai_apt_update_targets
  # #54 — facts are gathered INSIDE the block (first task), not here. A host
  # that failed or was unreachable at play-level fact gathering never reached
  # the rescue; with `serial: 1` its batch closed as fully failed and
  # ansible-core stopped the rest of the wave (and plays 3/4).
  gather_facts: false
  become: true
  serial: "{{ SERIAL_BATCH | default(1) }}"

  vars:
    # ACTION / UPDATE_MODE come from the facts play 1 published after
    # validation, not from the raw extra-vars (blank survey answers, absence).
    ACTION: "{{ hostvars['localhost']['samurai_action'] | default('Check') }}"
    UPDATE_MODE: "{{ hostvars['localhost']['samurai_update_mode'] | default('all') }}"
    EXCLUDE_PACKAGES_RAW: "{{ hostvars['localhost']['EXCLUDE_PACKAGES'] | default('') }}"
    ALLOW_REBOOT: "{{ hostvars['localhost']['ALLOW_REBOOT'] | default(false) | bool }}"
    EVIDENCE_BASE_DIR: "{{ hostvars['localhost']['EVIDENCE_BASE_DIR'] | default('/var/tmp/samurai-shield/apt-update') }}"

    exclude_packages_list: >-
      {{
        (EXCLUDE_PACKAGES_RAW | string).split(',')
        | map('trim') | reject('equalto', '') | list
      }}

    # dpkg options que mantêm o Apply não-interativo e preservam conffiles do
    # operador (padrão de frota: confdef + confold).
    apt_dpkg_opts:
      - "-o"
      - "Dpkg::Options::=--force-confdef"
      - "-o"
      - "Dpkg::Options::=--force-confold"

    samurai_warnings: []
    samurai_errors: []

    # #86 — serviços e portas em escuta antes/depois da mudança. O que estava
    # de pé e não voltou é iniciado de novo; se não subir, vira aviso (o job
    # não falha). SERVICE_CHECK=off desliga; SERVICE_IGNORE aceita nomes
    # (sufixo * = prefixo) e portas; SERVICE_SETTLE_SECONDS é a espera máxima
    # para os serviços voltarem sozinhos depois do update/reboot.
    svc_check_enabled: "{{ ((SERVICE_CHECK | default('') | string | trim) or 'on') | lower not in ['off', 'false', 'no', '0', 'disabled'] }}"
    svc_settle_seconds: "{{ ((SERVICE_SETTLE_SECONDS | default('') | string | trim) or '120') | int }}"
    svc_wait_retries: "{{ [((svc_settle_seconds | int) / 10) | round(0, 'ceil') | int, 1] | max + 1 }}"
    # Units que sobem/descem sozinhas (sob demanda, timers, sessão do próprio
    # Ansible) — comparar essas só gera ruído.
    svc_ignore_default:
      - "user@*"
      - "user-runtime-dir@*"
      - "session-*"
      - "apt-daily*"
      - "packagekit*"
      - "dnf-makecache*"
      - "fwupd*"
      - "man-db*"
      - "systemd-hostnamed"
      - "systemd-timedated"
      - "systemd-localed"
      - "systemd-fsckd"
    svc_ignore_list: "{{ svc_ignore_default + ((SERVICE_IGNORE | default('') | string).split(',') | map('trim') | reject('equalto', '') | list) }}"
    svc_ignore_ports: "{{ svc_ignore_list | select('match', '^[0-9]+$') | list }}"
    svc_ignore_regex: >-
      {%- set ns = namespace(r=[]) -%}
      {%- for e in svc_ignore_list | reject('match', '^[0-9]+$') -%}
      {%- set ns.r = ns.r + [((e[:-1] | regex_escape) if e.endswith('*') else ((e | regex_escape) ~ '([.]service)?$'))] -%}
      {%- endfor -%}
      ^({{ ns.r | join('|') }})
    # Leitura de svc_src (resultado do service_facts) e svc_ss_src (`ss -ltnp`).
    # Com systemd, só as entradas do systemd (o service_facts também lista os
    # scripts SysV, repetidos e sem `status`). Units `static` ficam de fora:
    # são as ativadas sob demanda (dbus, socket).
    svc_all_facts: "{{ svc_src.ansible_facts.services | default({}) | dict2items | map(attribute='value') | list }}"
    svc_facts_list: "{{ (svc_all_facts | selectattr('source', 'defined') | selectattr('source', 'equalto', 'systemd') | list) or svc_all_facts }}"
    svc_running_from_facts: >-
      {{ ((svc_facts_list | selectattr('status', 'defined') | rejectattr('status', 'equalto', 'static') | list)
          + (svc_facts_list | selectattr('status', 'undefined') | list))
         | selectattr('state', 'equalto', 'running')
         | map(attribute='name') | reject('match', svc_ignore_regex, true) | sort }}
    svc_failed_from_facts: >-
      {{ svc_facts_list | selectattr('status', 'defined') | selectattr('status', 'equalto', 'failed')
         | map(attribute='name') | reject('match', svc_ignore_regex, true) | sort }}
    svc_listeners_from_ss: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for l in (svc_ss_src.stdout_lines | default([])) -%}
      {%- set f = l.split() -%}
      {%- if f | length >= 4 and f[0] != 'State' -%}
      {%- set item = {'port': f[3].split(':')[-1], 'process': (l.split('"')[1] if '"' in l else 'unknown')} -%}
      {%- if item not in ns.out and item.port not in svc_ignore_ports and not (item.process is match(svc_ignore_regex, true)) -%}
      {%- set ns.out = ns.out + [item] -%}
      {%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.out | sort(attribute='port') }}
    samurai_held_by_playbook: []

  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:

    # #54 — controller clock (strftime sem epoch = agora, UTC), como o
    # finished_at desde o #3083: ansible_date_time só existe depois do setup,
    # que agora roda dentro do bloco e pode não rodar (host inalcançável).
    - name: "Capture execution start timestamp (UTC, controller-side)"
      ansible.builtin.set_fact:
        execution_started_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}"
        execution_timestamp: "{{ '%Y%m%dT%H%M%S' | strftime(utc=true) }}"

    # ------------------------------------------------------------------------
    # #54 — tudo que toca o host vive DENTRO do block, inclusive o fact
    # gathering, a validação de compatibilidade e o diretório de evidência:
    # toda falha por host atravessa rescue/always (summary.json +
    # samurai_shield_result estruturados, status=failed, erro legível) e é
    # re-falhada no play 4. Uma falha fora do rescue fecharia o batch do
    # `serial` como "inteiro falhado" e interromperia o resto da wave.
    # ------------------------------------------------------------------------
    - name: "Pre-check + optional update + post-check"
      block:

        # ---- Phase 1: reachability + evidence directory ---------------------
        # rescue NÃO pega host inalcançável: o setup ignora o unreachable e a
        # task seguinte o transforma numa falha comum. Com ignore_unreachable
        # o host não conta como unreachable para o batch; o play 4 o testa de
        # novo para o recap continuar dizendo unreachable.
        - name: "Gather facts (an unreachable host is recorded, not fatal to the wave)"
          ansible.builtin.setup:
          ignore_unreachable: true
          register: samurai_facts

        - name: "Record that the host was unreachable"
          ansible.builtin.set_fact:
            samurai_unreachable: true
          when: samurai_facts.unreachable | default(false)

        - name: "Fail when the host is unreachable"
          ansible.builtin.fail:
            msg: >-
              Host {{ inventory_hostname }} is unreachable:
              {{ samurai_facts.msg | default('connection failed') }}
          when: samurai_unreachable | default(false)

        - name: "Build evidence directory path"
          ansible.builtin.set_fact:
            evidence_dir: "{{ EVIDENCE_BASE_DIR }}/{{ inventory_hostname }}/{{ execution_timestamp }}"

        - name: "Create evidence directory"
          ansible.builtin.file:
            path: "{{ evidence_dir }}"
            state: directory
            mode: '0750'

        # O `always` só grava o summary.json quando o diretório existe — um host
        # inalcançável (ou sem diretório) não pode falhar de novo no `always`.
        - name: "Mark evidence directory as ready"
          ansible.builtin.set_fact:
            evidence_dir_ready: true

        # ---- Phase 2: OS compatibility + pre-check (always runs, even when
        # ACTION=Check) ------------------------------------------------------
        - name: "Fail when target OS family is not Debian"
          ansible.builtin.fail:
            msg: >-
              Unsupported OS family '{{ ansible_os_family }}' on host {{ inventory_hostname }}.
              This playbook only supports Debian-family systems (Ubuntu, Debian).
          when: ansible_os_family != 'Debian'

        - name: "Detect apt-get binary"
          ansible.builtin.stat:
            path: /usr/bin/apt-get
          register: apt_get_stat

        - name: "Fail when apt-get is not available"
          ansible.builtin.fail:
            msg: "/usr/bin/apt-get not found on {{ inventory_hostname }}."
          when: not apt_get_stat.stat.exists

        # ---- system info --------------------------------------------------
        - name: "Capture system info"
          ansible.builtin.set_fact:
            system_info:
              hostname: "{{ ansible_hostname }}"
              fqdn: "{{ ansible_fqdn }}"
              primary_ip: "{{ ansible_default_ipv4.address | default('unknown') }}"
              distribution: "{{ ansible_distribution }}"
              distribution_version: "{{ ansible_distribution_version }}"
              kernel: "{{ ansible_kernel }}"
              architecture: "{{ ansible_architecture }}"
              started_at: "{{ execution_started_at }}"
              run_user: "{{ ansible_user_id | default('root') }}"
              package_manager: "apt"

        - name: "Write system_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/system_before.txt"
            mode: '0640'
            content: |
              hostname: {{ system_info.hostname }}
              fqdn: {{ system_info.fqdn }}
              primary_ip: {{ system_info.primary_ip }}
              distribution: {{ system_info.distribution }} {{ system_info.distribution_version }}
              kernel: {{ system_info.kernel }}
              architecture: {{ system_info.architecture }}
              package_manager: {{ system_info.package_manager }}
              started_at: {{ system_info.started_at }}
              run_user: {{ system_info.run_user }}

        # ---- disk space ---------------------------------------------------
        - name: "Collect disk usage"
          ansible.builtin.command: df -P -k
          register: df_out
          changed_when: false

        - name: "Write disk_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/disk_before.txt"
            mode: '0640'
            content: "{{ df_out.stdout }}\n"

        - name: "Compute filesystem usage percent (portable)"
          ansible.builtin.shell: |
            set -o pipefail
            df -P {{ item }} 2>/dev/null | awk 'NR==2 {gsub("%","",$5); print $5}'
          args:
            executable: /bin/bash
          register: fs_pct
          changed_when: false
          failed_when: false
          loop:
            - "/"
            - "/var"
            - "/boot"

        - name: "Build filesystem usage dict"
          ansible.builtin.set_fact:
            fs_usage:
              root: "{{ (fs_pct.results[0].stdout | default('0') | trim) | int }}"
              var: "{{ (fs_pct.results[1].stdout | default('0') | trim) | int }}"
              boot: "{{ (fs_pct.results[2].stdout | default('0') | trim) | int }}"

        - name: "Fail when /var usage exceeds 90%"
          ansible.builtin.fail:
            msg: "/var is at {{ fs_usage.var }}% — refusing to update (threshold 90%)."
          when: fs_usage.var | int > 90

        - name: "Fail when /boot usage exceeds 85%"
          ansible.builtin.fail:
            msg: "/boot is at {{ fs_usage.boot }}% — refusing to update (threshold 85%)."
          when: fs_usage.boot | int > 85

        - name: "Warn when / usage exceeds 85%"
          ansible.builtin.set_fact:
            samurai_warnings: "{{ samurai_warnings + ['/ is at ' + (fs_usage.root | string) + '%, above 85% warning threshold'] }}"
          when: fs_usage.root | int > 85

        # ---- dpkg/apt locks ----------------------------------------------
        - name: "Detect running package manager processes"
          ansible.builtin.shell: |
            set -o pipefail
            ps -eo pid,comm,args | awk '/[a]pt|[a]pt-get|[d]pkg|[u]nattended-upgr/ {print}' || true
          args:
            executable: /bin/bash
          register: pm_locks
          changed_when: false

        - name: "Write package_manager_locks_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/package_manager_locks_before.txt"
            mode: '0640'
            content: "{{ pm_locks.stdout if pm_locks.stdout else 'no_active_package_manager_processes' }}\n"

        # `apt-get check` adquire o lock do dpkg e valida o banco de estado:
        # reprova com mensagem clara quando o lock está tomado OU quando um
        # `dpkg --configure -a` pendente deixaria o Apply em estado quebrado.
        - name: "Fail when the dpkg/apt lock is held or the dpkg state is broken"
          ansible.builtin.command: apt-get check -q
          register: apt_check_out
          changed_when: false

        # ---- refresh package indexes -------------------------------------
        # Um `apt update` que reprova (repositório EOL sem old-releases, 404,
        # GPG) é EXATAMENTE o tipo de causa que precisa chegar legível ao
        # Execution Center — por isso ele falha o host (via rescue) em vez de
        # seguir com índices velhos e reportar "0 updates" com cara de sucesso.
        # #56 — the mirror-bound tasks (index refresh, upgrade) are the long
        # ones, where a dropped SSH connection is likely. rescue does NOT catch
        # an unreachable host (and its `always` would not run), so these tasks
        # ignore it and the next task turns it into a normal failure.
        - name: "Refresh apt package indexes"
          ansible.builtin.apt:
            update_cache: true
          register: apt_update_result
          ignore_unreachable: true

        - name: "Record that the host became unreachable (apt index refresh)"
          ansible.builtin.set_fact:
            samurai_unreachable: true
          when: apt_update_result.unreachable | default(false)

        - name: "Fail when the host became unreachable (apt index refresh)"
          ansible.builtin.fail:
            msg: >-
              Host {{ inventory_hostname }} became unreachable while refreshing the apt indexes:
              {{ apt_update_result.msg | default('connection lost') }}
          when: apt_update_result.unreachable | default(false)

        # ---- installed packages before -----------------------------------
        - name: "List installed packages (before)"
          ansible.builtin.shell: |
            set -o pipefail
            dpkg-query -W -f '${Package}|${Version}|${Architecture}\n' | sort
          args:
            executable: /bin/bash
          register: pkgs_before
          changed_when: false

        - name: "Write packages_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/packages_before.txt"
            mode: '0640'
            content: "{{ pkgs_before.stdout }}\n"

        # ---- security-only sources (UPDATE_MODE=security) ------------------
        # Sem unattended-upgrade: o escopo security é aplicado restringindo o
        # apt às origens de segurança declaradas nos sources do host — nos
        # DOIS formatos que o apt aceita (linhas clássicas *-security E
        # stanzas Deb822 *.sources, preservadas inteiras: URI/Suites/
        # Components/opções). A descoberta vive num script versionado e
        # testado por unidade (files/samurai_apt_security_sources.sh). Se o
        # host não declara NENHUMA origem de segurança, o playbook RECUSA o
        # run em vez de alargar o escopo autorizado para um upgrade completo.
        - name: "Discover security-only apt sources (classic + Deb822)"
          ansible.builtin.script:
            cmd: "files/samurai_apt_security_sources.sh {{ evidence_dir }}"
          register: security_sources
          changed_when: false
          when: UPDATE_MODE == 'security'

        - name: "Fail when no security origin is declared on the host"
          ansible.builtin.fail:
            msg: >-
              UPDATE_MODE=security but {{ inventory_hostname }} declares no
              '-security' origin in its apt sources (classic or Deb822) —
              refusing to widen the authorized scope to a full upgrade. Fix
              the host's security origins (EOL releases must point at
              old-releases) and retry.
              ({{ security_sources.stdout_lines | last | default('no output') }})
          when:
            - UPDATE_MODE == 'security'
            - "'classic=0 deb822=0' in (security_sources.stdout | default(''))"

        - name: "Refresh indexes against the security-only sources"
          ansible.builtin.command:
            argv: >-
              {{
                ['apt-get', 'update', '-q',
                 '-o', 'Dir::Etc::SourceList=' + evidence_dir + '/security_only_sources.list',
                 '-o', 'Dir::Etc::SourceParts=' + evidence_dir + '/security_only.sources.d']
              }}
          register: security_update_out
          changed_when: false
          ignore_unreachable: true  # #56 — see "Refresh apt package indexes"
          when: UPDATE_MODE == 'security'

        - name: "Record that the host became unreachable (security index refresh)"
          ansible.builtin.set_fact:
            samurai_unreachable: true
          when: security_update_out.unreachable | default(false)

        - name: "Fail when the host became unreachable (security index refresh)"
          ansible.builtin.fail:
            msg: >-
              Host {{ inventory_hostname }} became unreachable while refreshing the security indexes:
              {{ security_update_out.msg | default('connection lost') }}
          when: security_update_out.unreachable | default(false)

        # ---- updates available before ------------------------------------
        - name: "Simulate upgrade to count available updates (before)"
          ansible.builtin.command:
            argv: >-
              {{
                ['apt-get', '-s', 'upgrade', '--with-new-pkgs']
                + (['-o', 'Dir::Etc::SourceList=' + evidence_dir + '/security_only_sources.list',
                    '-o', 'Dir::Etc::SourceParts=' + evidence_dir + '/security_only.sources.d'] if UPDATE_MODE == 'security' else [])
              }}
          register: check_update_out
          changed_when: false

        - name: "Determine updates available count"
          ansible.builtin.set_fact:
            updates_available_count: >-
              {{ check_update_out.stdout_lines | select('match', '^Inst ') | list | length }}

        - name: "Write updates_available_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/updates_available_before.txt"
            mode: '0640'
            content: |
              exit_code: {{ check_update_out.rc }}
              updates_available_count: {{ updates_available_count }}
              ---
              {{ check_update_out.stdout }}

        # ---- reboot required before --------------------------------------
        - name: "Check reboot-required marker (before)"
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_marker_before

        # States are 'required' / 'not_required' — never 'yes'/'no': set_fact
        # coerces those to booleans, and `== 'yes'` never matches again.
        - name: "Compute reboot_required_before status"
          ansible.builtin.set_fact:
            reboot_required_before: "{{ 'required' if reboot_marker_before.stat.exists else 'not_required' }}"

        - name: "Write reboot_required_before.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/reboot_required_before.txt"
            mode: '0640'
            content: |
              status: {{ reboot_required_before }}
              marker: /var/run/reboot-required
              exists: {{ reboot_marker_before.stat.exists }}
        # ---- #86 serviços e portas em escuta (antes) ----------------------
        # Foto do que está de pé antes da mudança, em Check e Apply. No Apply a
        # mesma foto é tirada depois do reboot e comparada com esta.
        - name: "Service check :: pre-change baseline"
          when:
            - svc_check_enabled | bool
          block:
            - name: "Service check :: collect services (before)"
              ansible.builtin.service_facts:
              register: svc_facts_before
              ignore_errors: true
              when: svc_check_enabled | bool

            - name: "Service check :: collect TCP listeners (before)"
              ansible.builtin.command:
                argv: [ss, -ltnp]
              register: svc_ss_before
              changed_when: false
              failed_when: false
              when: svc_check_enabled | bool

            - name: "Service check :: select the pre-change sources"
              ansible.builtin.set_fact:
                svc_src: "{{ svc_facts_before }}"
                svc_ss_src: "{{ svc_ss_before }}"
              when: svc_check_enabled | bool

            - name: "Service check :: record the pre-change baseline"
              ansible.builtin.set_fact:
                svc_running_before: "{{ svc_running_from_facts }}"
                svc_failed_before: "{{ svc_failed_from_facts }}"
                svc_listeners_before: "{{ svc_listeners_from_ss }}"
              when: svc_check_enabled | bool

            - name: "Write services_before.json"
              ansible.builtin.copy:
                dest: "{{ evidence_dir }}/services_before.json"
                mode: '0640'
                content: >-
                  {{ {'running_services': svc_running_before, 'failed_services': svc_failed_before,
                      'tcp_listeners': svc_listeners_before} | to_nice_json }}
              when: svc_check_enabled | bool

            - name: "Service check :: baseline result (Check)"
              ansible.builtin.set_fact:
                svc_check_result:
                  status: baseline_only
                  running_services_before: "{{ svc_running_before }}"
                  tcp_listeners_before: "{{ svc_listeners_before }}"
                  failed_services_before: "{{ svc_failed_before }}"
                svc_check_message:
                  - >-
                    BASELINE DE SERVIÇOS REGISTRADA (ACTION=Check) em {{ inventory_hostname }}:
                    {{ svc_running_before | length }} serviço(s) em execução e
                    {{ svc_listeners_before | length }} porta(s) TCP em escuta.
                    A validação pós-mudança roda no ACTION=Apply.
              when:
                - svc_check_enabled | bool
                - ACTION == 'Check'

            - name: "Service check :: result"
              ansible.builtin.debug:
                msg: "{{ svc_check_message }}"
              when:
                - svc_check_enabled | bool
                - ACTION == 'Check'
          rescue:
            # Nada da validação de serviços pode falhar o host (#86): um erro
            # inesperado aqui vira aviso, e a execução segue.
            - name: "Service check :: record that the check could not be completed (before)"
              ansible.builtin.set_fact:
                svc_check_result:
                  status: error
                  phase: before
                  error: "{{ ansible_failed_result.msg | default('erro desconhecido') }}"
                svc_check_message:
                  - >-
                    ATENÇÃO: a validação de serviços não pôde ser concluída em {{ inventory_hostname }}
                    (foto de antes da mudança). O job NÃO foi marcado como falho por isso; valide manualmente os
                    serviços do host. Erro: {{ ansible_failed_result.msg | default('erro desconhecido') }}

            - name: "Service check :: record the warning in the summary (before)"
              ansible.builtin.set_fact:
                samurai_warnings: "{{ samurai_warnings + svc_check_message }}"

            - name: "Service check :: result (before)"
              ansible.builtin.debug:
                msg: "{{ svc_check_message }}"

        # ------------------------------------------------------------------
        # Phase 3/4: Apply update (skipped in Check mode)
        # ------------------------------------------------------------------
        # apt não tem --exclude: a exclusão usa apt-mark hold, registrando o
        # que ESTE run segurou para soltar no always (holds pré-existentes do
        # operador nunca são tocados).
        - name: "Snapshot packages already on hold"
          ansible.builtin.command: apt-mark showhold
          register: holds_before
          changed_when: false
          when:
            - ACTION == 'Apply'
            - exclude_packages_list | length > 0

        - name: "Hold excluded packages for this run"
          ansible.builtin.command:
            argv: "{{ ['apt-mark', 'hold'] + samurai_hold_now }}"
          vars:
            samurai_hold_now: >-
              {{ exclude_packages_list | difference(holds_before.stdout_lines | default([])) }}
          register: hold_result
          changed_when: hold_result.rc == 0
          when:
            - ACTION == 'Apply'
            - exclude_packages_list | length > 0
            - (exclude_packages_list | difference(holds_before.stdout_lines | default([]))) | length > 0

        - name: "Record the holds taken by this run"
          ansible.builtin.set_fact:
            samurai_held_by_playbook: >-
              {{ exclude_packages_list | difference(holds_before.stdout_lines | default([])) }}
          when:
            - ACTION == 'Apply'
            - exclude_packages_list | length > 0

        - name: "Execute package upgrade"
          ansible.builtin.command:
            argv: >-
              {{
                ['apt-get', '-y', 'upgrade', '--with-new-pkgs'] + apt_dpkg_opts
                + (['-o', 'Dir::Etc::SourceList=' + evidence_dir + '/security_only_sources.list',
                    '-o', 'Dir::Etc::SourceParts=' + evidence_dir + '/security_only.sources.d'] if UPDATE_MODE == 'security' else [])
              }}
          register: update_result
          changed_when: >-
            ACTION == 'Apply' and update_result.rc == 0
            and ('0 upgraded, 0 newly installed' not in (update_result.stdout | default('')))
          failed_when: false
          ignore_unreachable: true  # #56 — see "Refresh apt package indexes"
          when: ACTION == 'Apply'

        - name: "Record that the host became unreachable (package upgrade)"
          ansible.builtin.set_fact:
            samurai_unreachable: true
          when: update_result.unreachable | default(false)

        - name: "Fail when the host became unreachable (package upgrade)"
          ansible.builtin.fail:
            msg: >-
              Host {{ inventory_hostname }} became unreachable during the package upgrade
              (the upgrade may be partially applied): {{ update_result.msg | default('connection lost') }}
          when: update_result.unreachable | default(false)

        - name: "Write update_stdout.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/update_stdout.txt"
            mode: '0640'
            content: "{{ (update_result.stdout | default('not_applicable_check_mode')) if ACTION == 'Apply' else 'not_applicable_check_mode' }}\n"

        - name: "Write update_stderr.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/update_stderr.txt"
            mode: '0640'
            content: "{{ (update_result.stderr | default('not_applicable_check_mode')) if ACTION == 'Apply' else 'not_applicable_check_mode' }}\n"

        - name: "Fail playbook when upgrade returned non-zero"
          ansible.builtin.fail:
            msg: "Package upgrade failed (rc={{ update_result.rc }}). See {{ evidence_dir }}/update_stderr.txt"
          when:
            - ACTION == 'Apply'
            - update_result.rc | default(0) != 0

        # ------------------------------------------------------------------
        # Phase 5: Post-check (only runs after Apply)
        # ------------------------------------------------------------------
        - name: "List installed packages (after)"
          ansible.builtin.shell: |
            set -o pipefail
            dpkg-query -W -f '${Package}|${Version}|${Architecture}\n' | sort
          args:
            executable: /bin/bash
          register: pkgs_after
          changed_when: false
          when: ACTION == 'Apply'

        - name: "Write packages_after.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/packages_after.txt"
            mode: '0640'
            content: "{{ (pkgs_after.stdout | default('')) if ACTION == 'Apply' else 'not_applicable_check_mode' }}\n"

        - name: "Compute packages diff before/after"
          ansible.builtin.set_fact:
            pkgs_before_set: "{{ pkgs_before.stdout_lines | default([]) | list }}"
            pkgs_after_set: "{{ pkgs_after.stdout_lines | default([]) | list }}"
          when: ACTION == 'Apply'

        # Backslash-free on purpose: Ansible doubles backslashes inside {{ }}
        # before Jinja, so a '\\' typed in a block scalar reaches re as '\\'
        # and '^([^|]+)\\|.*$' becomes an alternation that swallows the line.
        - name: "Identify updated packages (changed version)"
          ansible.builtin.set_fact:
            packages_updated: >-
              {{
                (pkgs_after_set | difference(pkgs_before_set))
                | map('split', '|') | map('first') | unique | list
              }}
          when: ACTION == 'Apply'

        - name: "Write packages_diff.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/packages_diff.txt"
            mode: '0640'
            content: |
              {% if ACTION == 'Apply' %}
              # Lines only in BEFORE (removed/replaced):
              {% for line in pkgs_before_set | difference(pkgs_after_set) %}
              - {{ line }}
              {% endfor %}
              # Lines only in AFTER (installed/upgraded):
              {% for line in pkgs_after_set | difference(pkgs_before_set) %}
              + {{ line }}
              {% endfor %}
              # Updated package names ({{ packages_updated | length }}):
              {% for name in packages_updated %}
              {{ name }}
              {% endfor %}
              {% else %}
              not_applicable_check_mode
              {% endif %}

        # ---- reboot required after --------------------------------------
        - name: "Check reboot-required marker (after)"
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_marker_after
          when: ACTION == 'Apply'

        - name: "Compute reboot_required_after status"
          ansible.builtin.set_fact:
            reboot_required_after: >-
              {{
                'not_applicable_check_mode' if ACTION != 'Apply'
                else ('required' if (reboot_marker_after.stat.exists | default(false)) else 'not_required')
              }}

        - name: "Write reboot_required_after.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/reboot_required_after.txt"
            mode: '0640'
            content: |
              status: {{ reboot_required_after }}
              marker: /var/run/reboot-required
              ---
              {{ 'exists' if (reboot_marker_after.stat.exists | default(false)) else 'absent_or_check_mode' }}

        # ---- kernel info -------------------------------------------------
        - name: "Capture kernel info (after)"
          ansible.builtin.shell: |
            set -o pipefail
            echo "running_kernel=$(uname -r)"
            echo "installed_kernels="
            dpkg-query -W -f '${Package} ${Version}\n' 'linux-image-*' 2>/dev/null || true
          args:
            executable: /bin/bash
          register: kernel_info
          changed_when: false
          when: ACTION == 'Apply'

        - name: "Write kernel_after.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/kernel_after.txt"
            mode: '0640'
            content: "{{ (kernel_info.stdout | default('')) if ACTION == 'Apply' else 'not_applicable_check_mode' }}\n"

        - name: "Capture kernel_after running version"
          ansible.builtin.command: uname -r
          register: kernel_after_uname
          changed_when: false
          when: ACTION == 'Apply'

        # ---- optional reboot --------------------------------------------
        - name: "Reboot host when ALLOW_REBOOT and reboot is required"
          ansible.builtin.reboot:
            msg: "SamurAI Shield :: post-update reboot"
            reboot_timeout: 600
          when:
            - ACTION == 'Apply'
            - ALLOW_REBOOT | bool
            - reboot_required_after == 'required'
          register: reboot_action

        # ---- failed services (after the reboot) ---------------------------
        # #86 — coletado DEPOIS do reboot (antes, uma unit que não voltava do
        # reboot nunca era vista). --plain: sem ele o systemd imprime um
        # marcador antes do nome e a lista saía como ['●'].
        - name: "Detect systemctl"
          ansible.builtin.stat:
            path: /usr/bin/systemctl
          register: systemctl_stat
          when: ACTION == 'Apply'

        - name: "List failed systemd units"
          ansible.builtin.command: systemctl --failed --no-pager --no-legend --plain
          register: failed_units
          changed_when: false
          failed_when: false
          when:
            - ACTION == 'Apply'
            - systemctl_stat.stat.exists | default(false)

        - name: "Build failed services list"
          ansible.builtin.set_fact:
            failed_services_list: >-
              {{
                (failed_units.stdout_lines | default([]))
                | map('trim') | reject('equalto', '')
                | map('split') | map('first') | list
              }}
          when: ACTION == 'Apply'

        - name: "Write failed_services_after.txt"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/failed_services_after.txt"
            mode: '0640'
            content: |
              {% if ACTION != 'Apply' %}
              not_applicable_check_mode
              {% elif not (systemctl_stat.stat.exists | default(false)) %}
              not_applicable
              {% else %}
              {{ failed_units.stdout | default('') }}
              {% endif %}
        # ---- #86 serviços e portas em escuta (depois do reboot) -----------
        # Compara com a foto de antes. O que caiu é iniciado de novo; o que não
        # subir vira aviso com o erro da tentativa. Nada aqui falha o host.
        # Espera até SERVICE_SETTLE_SECONDS os serviços voltarem sozinhos. A
        # espera termina sem erro na última tentativa (attempts), em vez de
        # esgotar os retries e sair como falha ignorada.
        - name: "Service check :: compare with the pre-change baseline"
          when:
            - ACTION == 'Apply'
            - svc_check_enabled | bool
            - svc_running_before is defined
            - (svc_check_result.status | default('')) != 'error'
          block:
            - name: "Service check :: wait for the services that were running before"
              ansible.builtin.command:
                argv: "{{ ['systemctl', 'is-active'] + svc_running_before }}"
              register: svc_wait
              changed_when: false
              failed_when: false
              until: >-
                (svc_wait.stdout_lines | default([]) | reject('equalto', 'active') | list | length == 0)
                or ((svc_wait.attempts | default(1) | int) >= (svc_wait_retries | int))
              retries: "{{ svc_wait_retries }}"
              delay: 10
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool
                - svc_running_before | length > 0

            - name: "Service check :: collect services (after the wait)"
              ansible.builtin.service_facts:
              register: svc_facts_wait
              ignore_errors: true
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: select the post-reboot source"
              ansible.builtin.set_fact:
                svc_src: "{{ svc_facts_wait }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: list services that did not come back"
              ansible.builtin.set_fact:
                svc_down: "{{ svc_running_before | difference(svc_running_from_facts) }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: try to start the services that did not come back"
              ansible.builtin.service:
                name: "{{ item }}"
                state: started
              loop: "{{ svc_down | default([]) }}"
              register: svc_restart
              failed_when: false
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: wait for the services the playbook started"
              ansible.builtin.command:
                argv: "{{ ['systemctl', 'is-active'] + svc_down }}"
              register: svc_wait_started
              changed_when: false
              failed_when: false
              until: >-
                (svc_wait_started.stdout_lines | default([]) | reject('equalto', 'active') | list | length == 0)
                or ((svc_wait_started.attempts | default(1) | int) >= 3)
              retries: 3
              delay: 5
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool
                - svc_down | default([]) | length > 0

            - name: "Service check :: collect services (after)"
              ansible.builtin.service_facts:
              register: svc_facts_final
              ignore_errors: true
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool
                - svc_down | default([]) | length > 0

            - name: "Service check :: collect TCP listeners (after)"
              ansible.builtin.command:
                argv: [ss, -ltnp]
              register: svc_ss_after
              changed_when: false
              failed_when: false
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: select the post-change sources"
              ansible.builtin.set_fact:
                svc_src: "{{ svc_facts_wait if (svc_facts_final is skipped) else svc_facts_final }}"
                svc_ss_src: "{{ svc_ss_after }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: record the post-change state"
              ansible.builtin.set_fact:
                svc_running_after: "{{ svc_running_from_facts }}"
                svc_failed_after: "{{ svc_failed_from_facts }}"
                svc_listeners_after: "{{ svc_listeners_from_ss }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: compute what changed"
              ansible.builtin.set_fact:
                svc_still_down: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- for s in (svc_running_before | difference(svc_running_after)) -%}
                  {%- set r = (svc_restart.results | default([]) | selectattr('item', 'defined') | selectattr('item', 'equalto', s) | list) -%}
                  {%- set err = ((r[0].msg | default('')) if r else '') | string | trim -%}
                  {%- if not r -%}
                  {%- set err = 'não houve tentativa de inicialização (o serviço caiu depois da checagem)' -%}
                  {%- elif not err -%}
                  {%- set err = 'o start foi aceito, mas o serviço não ficou em execução; veja journalctl -u ' ~ s -%}
                  {%- endif -%}
                  {%- set ns.out = ns.out + [{'service': s, 'error': err}] -%}
                  {%- endfor -%}
                  {{ ns.out }}
                svc_restored: "{{ (svc_down | default([])) | intersect(svc_running_after) }}"
                # Porta perdida = sumiu E o processo dono passou a escutar em menos
                # portas que antes. Tolera portas dinâmicas (RPC, rpc.statd: o
                # processo troca de porta, mas mantém a quantidade) e ainda pega
                # uma de duas aplicações com o mesmo nome de processo (java).
                svc_listeners_lost: >-
                  {%- set ports = svc_listeners_after | map(attribute='port') | list -%}
                  {%- set ns = namespace(out=[]) -%}
                  {%- for l in svc_listeners_before -%}
                  {%- set n_before = svc_listeners_before | selectattr('process', 'equalto', l.process) | list | length -%}
                  {%- set n_after = svc_listeners_after | selectattr('process', 'equalto', l.process) | list | length -%}
                  {%- if l.port not in ports and (l.process == 'unknown' or n_after < n_before) -%}
                  {%- set ns.out = ns.out + [l] -%}
                  {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out }}
                svc_failed_new: "{{ svc_failed_after | difference(svc_failed_before) | difference(svc_running_before) }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: build the result and the message"
              ansible.builtin.set_fact:
                svc_check_result:
                  status: "{{ 'ok' if (svc_still_down | length == 0 and svc_listeners_lost | length == 0 and svc_failed_new | length == 0) else 'warning' }}"
                  running_services_before: "{{ svc_running_before }}"
                  tcp_listeners_before: "{{ svc_listeners_before }}"
                  services_restored_by_playbook: "{{ svc_restored }}"
                  services_still_down: "{{ svc_still_down }}"
                  tcp_listeners_lost: "{{ svc_listeners_lost }}"
                  failed_services_before: "{{ svc_failed_before }}"
                  failed_services_after: "{{ svc_failed_after }}"
                  services_newly_failed: "{{ svc_failed_new }}"
                svc_check_message: >-
                  {%- set ns = namespace(issues=[]) -%}
                  {%- for s in svc_still_down -%}
                  {%- set ns.issues = ns.issues + ['serviço ' ~ s.service ~ ': estava em execução antes da mudança e não subiu, nem após a tentativa de inicialização pelo playbook. Erro da tentativa: ' ~ s.error] -%}
                  {%- endfor -%}
                  {%- for l in svc_listeners_lost -%}
                  {%- set ns.issues = ns.issues + ['porta TCP ' ~ l.port ~ ' (processo ' ~ l.process ~ '): estava em escuta antes da mudança e não está mais. Se a porta é de um serviço citado acima, é consequência dele; se não, é uma aplicação fora do gerenciador de serviços, que o playbook não reinicia. Valide a aplicação.'] -%}
                  {%- endfor -%}
                  {%- for s in svc_failed_new -%}
                  {%- set ns.issues = ns.issues + ['serviço ' ~ s ~ ': passou a falhar depois da mudança (não estava em falha antes).'] -%}
                  {%- endfor -%}
                  {%- set restored = ['Iniciados pelo playbook porque não voltaram sozinhos (estão em execução agora): ' ~ (svc_restored | join(', '))] if svc_restored else [] -%}
                  {%- if ns.issues -%}
                  {{ ['ATENÇÃO: SERVIÇOS NÃO CONFORMES COM O CENÁRIO PRÉ-MUDANÇA em ' ~ inventory_hostname ~ '. O job NÃO foi marcado como falho por isso. Valide no host o motivo de cada item abaixo:'] + ns.issues + restored }}
                  {%- else -%}
                  {{ ['SERVIÇOS VALIDADOS em ' ~ inventory_hostname ~ ': os ' ~ (svc_running_before | length) ~ ' serviço(s) e as ' ~ (svc_listeners_before | length) ~ ' porta(s) TCP em escuta que estavam ativos antes da mudança estão ativos novamente, conforme o cenário pré-mudança.'] + restored }}
                  {%- endif -%}
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Service check :: record the warning in the summary"
              ansible.builtin.set_fact:
                samurai_warnings: "{{ samurai_warnings + svc_check_message[1:] | reject('match', '^Iniciados pelo playbook') | list }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool
                - svc_check_result.status == 'warning'

            - name: "Service check :: result"
              ansible.builtin.debug:
                msg: "{{ svc_check_message }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool

            - name: "Write services_check.json"
              ansible.builtin.copy:
                dest: "{{ evidence_dir }}/services_check.json"
                mode: '0640'
                content: "{{ svc_check_result | to_nice_json }}"
              when:
                - ACTION == 'Apply'
                - svc_check_enabled | bool
          rescue:
            # Nada da validação de serviços pode falhar o host (#86): um erro
            # inesperado aqui vira aviso, e a execução segue.
            - name: "Service check :: record that the check could not be completed (after)"
              ansible.builtin.set_fact:
                svc_check_result:
                  status: error
                  phase: after
                  error: "{{ ansible_failed_result.msg | default('erro desconhecido') }}"
                svc_check_message:
                  - >-
                    ATENÇÃO: a validação de serviços não pôde ser concluída em {{ inventory_hostname }}
                    (comparação depois da mudança). O job NÃO foi marcado como falho por isso; valide manualmente os
                    serviços do host. Erro: {{ ansible_failed_result.msg | default('erro desconhecido') }}

            - name: "Service check :: record the warning in the summary (after)"
              ansible.builtin.set_fact:
                samurai_warnings: "{{ samurai_warnings + svc_check_message }}"

            - name: "Service check :: result (after)"
              ansible.builtin.debug:
                msg: "{{ svc_check_message }}"

      rescue:
        - name: "Capture rescue error"
          ansible.builtin.set_fact:
            samurai_errors: "{{ samurai_errors + [ansible_failed_result.msg | default('unknown failure')] }}"

        - name: "Mark execution status as failed"
          ansible.builtin.set_fact:
            execution_status: "failed"

      always:
        # ------------------------------------------------------------------
        # Restore holds taken by THIS run (never the operator's own holds),
        # then summary.json — runs even on failure.
        # ------------------------------------------------------------------
        - name: "Release the holds taken by this run"
          ansible.builtin.command:
            argv: "{{ ['apt-mark', 'unhold'] + samurai_held_by_playbook }}"
          changed_when: true
          failed_when: false
          ignore_unreachable: true  # #56 — `always` has no rescue
          register: samurai_unhold
          when:
            - samurai_held_by_playbook | length > 0
            - not (samurai_unreachable | default(false) | bool)

        - name: "Warn when the holds taken by this run could not be released"
          ansible.builtin.set_fact:
            samurai_warnings: >-
              {{ samurai_warnings + ['holds taken by this run may still be in place (host unreachable): '
                 + (samurai_held_by_playbook | join(', '))] }}
          when:
            - samurai_held_by_playbook | length > 0
            - (samurai_unreachable | default(false) | bool) or (samurai_unhold.unreachable | default(false))

        - name: "Compute final execution status"
          ansible.builtin.set_fact:
            execution_status: >-
              {{
                execution_status | default(
                  'check_completed' if ACTION == 'Check'
                  else ('updated' if (packages_updated | default([]) | length) > 0
                        else 'no_updates')
                )
              }}

        - name: "Capture finished_at timestamp"
          ansible.builtin.set_fact:
            # bedin/PR #3083 — ansible_date_time e coletado UMA vez no fact
            # gathering: usa-lo aqui repetia o started_at e zerava a duracao
            # aparente na evidencia. strftime sem epoch = agora (UTC).
            execution_finished_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}"

        - name: "Build per-host summary"
          ansible.builtin.set_fact:
            host_summary:
              tool: "SamurAI Shield"
              playbook: "linux_apt_update_with_evidence"
              host: "{{ inventory_hostname }}"
              fqdn: "{{ ansible_fqdn | default(inventory_hostname) }}"
              primary_ip: "{{ ansible_default_ipv4.address | default('unknown') }}"
              os_family: "{{ ansible_os_family | default('unknown') }}"
              distribution: "{{ ansible_distribution | default('unknown') }}"
              distribution_version: "{{ ansible_distribution_version | default('unknown') }}"
              kernel_before: "{{ ansible_kernel | default('unknown') }}"
              kernel_after: "{{ kernel_after_uname.stdout | default(ansible_kernel | default('unknown')) | trim }}"
              package_manager: "apt"
              action: "{{ ACTION }}"
              update_mode: "{{ UPDATE_MODE }}"
              exclude_packages: "{{ exclude_packages_list }}"
              updates_available_before_count: "{{ updates_available_count | default(0) | int }}"
              packages_updated_count: "{{ (packages_updated | default([])) | length }}"
              packages_updated: "{{ packages_updated | default([]) }}"
              reboot_required_before: "{{ reboot_required_before | default('unknown') }}"
              reboot_required_after: "{{ reboot_required_after | default('not_applicable_check_mode') }}"
              rebooted: "{{ (reboot_action.rebooted | default(false)) | bool }}"
              failed_services_after: "{{ failed_services_list | default([]) }}"
              service_check: "{{ svc_check_result | default({'status': ('disabled' if not (svc_check_enabled | bool) else 'not_run')}) }}"
              evidence_dir: "{{ evidence_dir if (evidence_dir_ready | default(false)) else 'not_created' }}"
              unreachable: "{{ samurai_unreachable | default(false) | bool }}"
              started_at: "{{ execution_started_at }}"
              finished_at: "{{ execution_finished_at }}"
              status: "{{ execution_status }}"
              warnings: "{{ samurai_warnings }}"
              errors: "{{ samurai_errors }}"

        # #56 — `always` has no rescue: a failing (or unreachable) write here
        # used to fail the host inside play 2 and, with `serial: 1`, stop the
        # rest of the wave. The error is tolerated, then recorded: the host
        # ends `failed` (the evidence on disk is part of the contract) and is
        # re-failed in play 4.
        - name: "Write summary.json"
          ansible.builtin.copy:
            dest: "{{ evidence_dir }}/summary.json"
            mode: '0640'
            content: "{{ host_summary | to_nice_json }}\n"
          register: samurai_summary_write
          ignore_errors: true
          ignore_unreachable: true
          when:
            - evidence_dir_ready | default(false)
            - not (samurai_unreachable | default(false) | bool)

        - name: "Record that summary.json could not be written"
          ansible.builtin.set_fact:
            execution_status: "failed"
            samurai_unreachable: "{{ ((samurai_unreachable | default(false) | bool) or (samurai_summary_write.unreachable | default(false))) | bool }}"
            samurai_errors: >-
              {{ samurai_errors + ['summary.json could not be written to ' + evidence_dir + ': '
                 + (samurai_summary_write.msg | default('unknown error'))] }}
          when: samurai_summary_write is failed or (samurai_summary_write.unreachable | default(false))

        - name: "Reflect the summary.json write failure in the published summary"
          ansible.builtin.set_fact:
            host_summary: >-
              {{ host_summary | combine({'status': execution_status, 'errors': samurai_errors,
                                         'unreachable': samurai_unreachable | bool}) }}
          when: samurai_summary_write is failed or (samurai_summary_write.unreachable | default(false))

        - name: "Publish per-host summary as run stat"
          ansible.builtin.set_stats:
            data:
              samurai_apt_update_summary: "{{ host_summary }}"
            per_host: true
            aggregate: false

    # #48 — o re-fail do #3037 (C3) NÃO fica mais aqui: com `serial: 1`, um
    # host re-falhado neste play fecha o batch como "inteiro falhado" e o
    # ansible-core (PlaybookExecutor, break_play) interrompe a wave — os hosts
    # seguintes e o play 3 não rodam. Ele foi movido para o play 4.


- name: "SamurAI :: apt-update :: emit consolidated stdout JSON"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Collect per-host summaries"
      ansible.builtin.set_fact:
        all_host_summaries: >-
          {{
            groups['samurai_apt_update_targets'] | default([])
            | map('extract', hostvars, 'host_summary')
            | select('defined') | list
          }}

    - name: "Compute consolidated status"
      ansible.builtin.set_fact:
        consolidated_status: >-
          {{
            'failed' if (all_host_summaries | selectattr('status', 'equalto', 'failed') | list | length) > 0
            else 'completed'
          }}

    - name: "Build consolidated samurai_shield_result block"
      ansible.builtin.set_fact:
        samurai_shield_result:
          playbook: "linux_apt_update_with_evidence"
          action: "{{ samurai_action | default('Check') }}"
          update_mode: "{{ samurai_update_mode | default('all') }}"
          status: "{{ consolidated_status }}"
          host_count: "{{ all_host_summaries | length }}"
          hosts: "{{ all_host_summaries }}"

    - name: "Print consolidated SamurAI Shield JSON to stdout"
      ansible.builtin.debug:
        msg: "{{ {'samurai_shield_result': samurai_shield_result} | to_nice_json }}"

    # #86 — uma linha por host com o resultado da validação de serviços.
    - name: "Service check :: consolidated result"
      ansible.builtin.debug:
        msg: >-
          {%- set ns = namespace(out=[]) -%}
          {%- for h in all_host_summaries -%}
          {%- set sc = h.service_check | default({}) -%}
          {%- set st = sc.status | default('not_run') -%}
          {%- if st == 'ok' -%}
          {%- set line = h.host ~ ': SERVIÇOS VALIDADOS (conforme o cenário pré-mudança)' -%}
          {%- elif st == 'warning' -%}
          {%- set line = h.host ~ ': ATENÇÃO, serviços não conformes com o cenário pré-mudança (veja os avisos do host); o job não falhou por isso' -%}
          {%- elif st == 'baseline_only' -%}
          {%- set line = h.host ~ ': baseline de serviços registrada (ACTION=Check)' -%}
          {%- elif st == 'error' -%}
          {%- set line = h.host ~ ': ATENÇÃO, a validação de serviços não pôde ser concluída (veja os avisos do host); o job não falhou por isso' -%}
          {%- elif st == 'disabled' -%}
          {%- set line = h.host ~ ': validação de serviços desligada (SERVICE_CHECK=off)' -%}
          {%- else -%}
          {%- set line = h.host ~ ': validação de serviços não executada (a execução do host terminou antes)' -%}
          {%- endif -%}
          {%- set ns.out = ns.out + [line] -%}
          {%- endfor -%}
          {{ ns.out }}

    - name: "Publish consolidated result as workflow stat"
      ansible.builtin.set_stats:
        data:
          samurai_shield_result: "{{ samurai_shield_result }}"
        aggregate: false
        per_host: false


# #3037 (C3, mesmo padrão do playbook yum) — o rescue do play 2 recupera o
# host para o `always` conseguir escrever a evidência estruturada; sem este
# re-fail o host recuperado sairia `failed=0` no PLAY RECAP e o grading do
# Execution Center o contaria como sucesso. #48 — o re-fail roda num play
# PRÓPRIO, depois do JSON consolidado, e não no play 2: aqui cada host já
# passou pelo play 2 e o play 3 já emitiu o samurai_shield_result.
- name: "SamurAI :: apt-update :: fail hosts whose execution ended failed"
  hosts: samurai_apt_update_targets
  gather_facts: false
  tasks:
    # #54 — a tentativa de conexão do play 2 ignorou o `unreachable` para a
    # wave seguir. Aqui ela é refeita SEM ignorar: um host que continua fora
    # sai `unreachable` no PLAY RECAP (é nisso que o AAP failure analyst se
    # apoia para HOST_UNREACHABLE), não como falha genérica de task. Um host
    # que responde agora terminou falho do mesmo jeito e é re-falhado abaixo.
    - name: "Re-check hosts that were unreachable in play 2"
      ansible.builtin.ping:
      when: samurai_unreachable | default(false) | bool

    - name: "Fail the host when execution ended failed (structured evidence already published)"
      ansible.builtin.fail:
        msg: >-
          Remediation failed on {{ inventory_hostname }}:
          {{ (samurai_errors | join(' | ')) if (samurai_errors | default([]) | length) > 0 else 'see summary.json' }}
      when: (execution_status | default('')) == 'failed'
