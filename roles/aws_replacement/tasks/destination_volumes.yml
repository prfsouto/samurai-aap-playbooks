---
# ============================================================================
# Os volumes de destino da continuidade de dados.
#
# O plano congelado traz a INTENÇÃO de cada volume; o disco só pode nascer aqui,
# porque só aqui o candidato existe e a zona é conhecida. O que sobe de volta ao
# control plane é o vínculo — id do volume, não caminho de dispositivo.
#
# Idempotente pela etiqueta: o volume é procurado pelo par (plano, revisão,
# volume de origem). Retentativa reaproveita; dois casamentos recusam, porque
# escolher entre dois destinos é escolher no escuro.
# ============================================================================

- name: "[aws_replacement] Refuse an incomplete destination slot"
  ansible.builtin.assert:
    that:
      - destination_item.destination_slot_id | default('') | length > 0
      - (destination_item.destination_size_gb | int) * 1024 * 1024 * 1024 >= (destination_item.size_bytes | int)
      - destination_item.destination_volume_type | default('') | length > 0
    fail_msg: >-
      every persistent source requires a named destination slot whose size is at
      least the source size and whose volume type was frozen in the Blueprint
    quiet: true
  tags: [aws_replacement, data_sync, guard]

- name: "[aws_replacement] Look for a destination already created for this item"
  ansible.builtin.command:
    argv:
      - "{{ aws_replacement_aws_cli_binary }}"
      - ec2
      - describe-volumes
      - --region
      - "{{ aws_replacement_region }}"
      - --filters
      - "Name=tag:samurai_plan_id,Values={{ data_sync_plan_id }}"
      - "Name=tag:samurai_plan_revision,Values={{ data_sync_plan_revision | string }}"
      - "Name=tag:samurai_source_volume_stable_id,Values={{ destination_item.source_volume_stable_id }}"
      - "Name=tag:samurai_destination_slot_id,Values={{ destination_item.destination_slot_id }}"
      - --query
      - "Volumes[].{VolumeId:VolumeId,Size:Size,KmsKeyId:KmsKeyId,Az:AvailabilityZone,Attachments:Attachments}"
      - --output
      - json
  register: aws_replacement_destination_existing
  changed_when: false
  tags: [aws_replacement, data_sync]

- name: "[aws_replacement] Refuse more than one destination for the same source volume"
  ansible.builtin.assert:
    that:
      - (aws_replacement_destination_existing.stdout | from_json | length) < 2
    fail_msg: >-
      more than one destination volume carries the tags of
      {{ destination_item.source_volume_stable_id }} under plan
      {{ data_sync_plan_id }} revision {{ data_sync_plan_revision }}. Two answers to
      "which disk is the destination" is no answer: picking the newest would copy
      customer data into a disk nobody chose.
    quiet: true
  tags: [aws_replacement, data_sync, guard]

- name: "[aws_replacement] Create the empty destination volume"
  when: (aws_replacement_destination_existing.stdout | from_json | length) == 0
  ansible.builtin.command:
    argv:
      - "{{ aws_replacement_aws_cli_binary }}"
      - ec2
      - create-volume
      - --region
      - "{{ aws_replacement_region }}"
      - --availability-zone
      - "{{ aws_replacement_describe_proof.Placement.AvailabilityZone | default(aws_replacement_availability_zone) }}"
      # A vaga congelada decide a geometria. O filesystem atravessa com a
      # geometria da origem; espaço excedente permanece sem crescimento implícito.
      - --size
      - "{{ destination_item.destination_size_gb | int }}"
      - --volume-type
      - "{{ destination_item.destination_volume_type }}"
      - --encrypted
      - --kms-key-id
      - "{{ data_sync_destination_kms_key_id }}"
      - --tag-specifications
      - >-
        ResourceType=volume,Tags=[
        {Key=managed_by,Value=samurai-shield},
        {Key=samurai_organization_id,Value={{ aws_replacement_organization_id | string }}},
        {Key=samurai_campaign_server_execution_id,Value={{ samurai_campaign_server_execution_id | string }}},
        {Key=samurai_plan_id,Value={{ data_sync_plan_id }}},
        {Key=samurai_plan_revision,Value={{ data_sync_plan_revision | string }}},
        {Key=samurai_plan_digest,Value={{ samurai_data_replication_plan_digest }}},
        {Key=samurai_source_volume_stable_id,Value={{ destination_item.source_volume_stable_id }}},
        {Key=samurai_destination_slot_id,Value={{ destination_item.destination_slot_id }}}
        ]
      - --query
      - "{VolumeId:VolumeId,Size:Size,KmsKeyId:KmsKeyId,Az:AvailabilityZone}"
      - --output
      - json
  register: aws_replacement_destination_created
  tags: [aws_replacement, data_sync]

- name: "[aws_replacement] Point at the destination for this item"
  ansible.builtin.set_fact:
    aws_replacement_destination: >-
      {{ (aws_replacement_destination_created.stdout | from_json)
         if (aws_replacement_destination_created is defined
             and aws_replacement_destination_created.stdout | default('') | length > 0)
         else (aws_replacement_destination_existing.stdout | from_json | first) }}
  tags: [aws_replacement, data_sync]

- name: "[aws_replacement] Refuse a destination smaller than the source"
  ansible.builtin.assert:
    that:
      - (aws_replacement_destination.Size | int) * 1024 * 1024 * 1024
        >= (destination_item.size_bytes | int)
      - aws_replacement_destination.KmsKeyId | default('') | length > 0
    fail_msg: >-
      destination {{ aws_replacement_destination.VolumeId | default('?') }} does not
      satisfy {{ destination_item.source_volume_stable_id }}: it must be at least the
      size of the source and encrypted under the platform key. A smaller destination
      truncates customer data; an unencrypted one leaves a copy of it at rest.
    quiet: true
  tags: [aws_replacement, data_sync, guard]

- name: "[aws_replacement] Attach the destination to the candidate"
  when: (aws_replacement_destination.Attachments | default([]) | length) == 0
  ansible.builtin.command:
    argv:
      - "{{ aws_replacement_aws_cli_binary }}"
      - ec2
      - attach-volume
      - --region
      - "{{ aws_replacement_region }}"
      - --volume-id
      - "{{ aws_replacement_destination.VolumeId }}"
      - --instance-id
      - "{{ aws_replacement_instance_id }}"
      # O nome pedido aqui NÃO é o caminho dentro da máquina: em instância Nitro
      # o kernel ignora o mapeamento e enumera por conta própria. Quem diz qual
      # disco é qual é o serial, lido depois do anexo, dentro do candidato.
      - --device
      - "/dev/sd{{ 'fghijklmnop'[destination_index | int] }}"
  register: aws_replacement_destination_attach
  changed_when: aws_replacement_destination_attach.rc == 0
  tags: [aws_replacement, data_sync]

- name: "[aws_replacement] Remember this binding for the control plane"
  ansible.builtin.set_fact:
    aws_replacement_destination_bindings: >-
      {{ (aws_replacement_destination_bindings | default([])) + [{
        'replication_execution_id': destination_item.replication_execution_id,
        'source_volume_stable_id': destination_item.source_volume_stable_id,
        'destination_slot_id': destination_item.destination_slot_id,
        'destination_volume_stable_id': aws_replacement_destination.VolumeId,
        'candidate_instance_id': aws_replacement_instance_id,
        'size_bytes': (aws_replacement_destination.Size | int) * 1024 * 1024 * 1024,
        'encryption_key_id': aws_replacement_destination.KmsKeyId,
        'availability_zone': aws_replacement_destination.Az | default('')
      }] }}
  tags: [aws_replacement, data_sync]
