---
# RFC-004 Camada 1 — read-only inventory collection. Machine A is never
# mutated by this role. The package map and workload evidence are observations
# only; downstream deterministic ETL owns interpretation.

- name: "[inventory_collect] Display incoming payload (the presigned URL carries the signature, so only its presence is shown)"
  ansible.builtin.debug:
    msg:
      execution_id: "{{ samurai_execution_id | default('unknown') }}"
      organization_id: "{{ inventory_collect_organization_id }}"
      target_host: "{{ inventory_collect_target_host }}"
      facts_s3_presigned_put_url: >-
        {{ 'set' if (inventory_collect_facts_s3_presigned_put_url | length > 0) else 'MISSING' }}
      facts_s3_put_headers: "{{ inventory_collect_facts_s3_put_headers }}"
      schema: "{{ inventory_collect_schema }}"
  tags: [inventory_collect, debug]

- name: "[inventory_collect] Enumerate installed packages (read-only)"
  ansible.builtin.package_facts:
    manager: auto
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Observe cloud-init completion (read-only)"
  ansible.builtin.command:
    argv:
      - cloud-init
      - status
      - --wait
  register: inventory_collect_cloud_init
  changed_when: false
  failed_when: false
  async: "{{ inventory_collect_cloud_init_timeout_seconds | int }}"
  poll: 1
  when: "'cloud-init' in (ansible_facts.packages | default({}))"
  tags: [inventory_collect, collect, functional]

- name: "[inventory_collect] Observe systemd health (read-only)"
  ansible.builtin.command:
    argv:
      - systemctl
      - is-system-running
  register: inventory_collect_systemd
  changed_when: false
  failed_when: false
  when: (ansible_facts.service_mgr | default('')) == 'systemd'
  tags: [inventory_collect, collect, functional]

- name: "[inventory_collect] Record functional observations"
  ansible.builtin.set_fact:
    inventory_collect_functional:
      # Reaching this task through the machine connection proves the SSH
      # conversation used by this collection, including its configured port.
      ssh_ok: true
      cloud_init_ok: >-
        {{ (inventory_collect_cloud_init.rc | default(1) | int) == 0
           if (inventory_collect_cloud_init is defined
               and not (inventory_collect_cloud_init.skipped | default(false) | bool))
           else false }}
      systemd_no_degraded: >-
        {{ (inventory_collect_systemd.rc | default(1) | int) == 0
           and (inventory_collect_systemd.stdout | default('') | trim) == 'running'
           if (inventory_collect_systemd is defined
               and not (inventory_collect_systemd.skipped | default(false) | bool))
           else false }}
  tags: [inventory_collect, collect, functional]

- name: "[inventory_collect] Initialize workload evidence as unavailable"
  ansible.builtin.set_fact:
    inventory_collect_manual_packages_status: unavailable
    inventory_collect_manual_packages_reason: unsupported_platform
  tags: [inventory_collect, collect]

# Debian/Ubuntu workload-root evidence. ``apt-mark showmanual`` only reads the
# dpkg selection state; it does not install, remove, mark or otherwise mutate a
# package. Failure remains explicit and fail-closed; it is never converted into
# an empty successful list.
- name: "[inventory_collect] Observe manually installed APT packages (read-only)"
  ansible.builtin.command:
    argv:
      - apt-mark
      - showmanual
  register: inventory_collect_apt_manual
  changed_when: false
  failed_when: false
  when: (ansible_facts.os_family | default('')) == 'Debian'
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Normalize successful APT workload evidence"
  ansible.builtin.set_fact:
    inventory_collect_manual_packages: >-
      {{ inventory_collect_apt_manual.stdout_lines
         | default([])
         | map('trim')
         | reject('equalto', '')
         | list
         | sort }}
    inventory_collect_manual_packages_status: ready
    inventory_collect_manual_packages_reason: ""
  when:
    - inventory_collect_apt_manual is defined
    - not (inventory_collect_apt_manual.skipped | default(false))
    - (inventory_collect_apt_manual.rc | default(1)) == 0
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Record failed APT workload observation"
  ansible.builtin.set_fact:
    inventory_collect_manual_packages_status: unavailable
    inventory_collect_manual_packages_reason: manual_package_observation_failed
  when:
    - (ansible_facts.os_family | default('')) == 'Debian'
    - inventory_collect_apt_manual is defined
    - not (inventory_collect_apt_manual.skipped | default(false))
    - (inventory_collect_apt_manual.rc | default(1)) != 0
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Assemble the raw facts document"
  ansible.builtin.set_fact:
    inventory_collect_document:
      schema: "{{ inventory_collect_schema }}"
      samurai_execution_id: "{{ samurai_execution_id }}"
      organization_id: "{{ inventory_collect_organization_id }}"
      target_host: "{{ inventory_collect_target_host }}"
      collected_at: "{{ now(utc=True, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      ansible_facts: >-
        {{
          (ansible_facts
            | dict2items
            | rejectattr('key', 'equalto', 'packages')
            | items2dict)
          | combine({
              'samurai_manual_packages_status': inventory_collect_manual_packages_status,
              'samurai_manual_packages_reason': inventory_collect_manual_packages_reason
            })
          | combine({'samurai_functional': inventory_collect_functional})
          | combine(
              {'samurai_manual_packages': inventory_collect_manual_packages}
              if inventory_collect_manual_packages is defined
              else {}
            )
        }}
      packages: "{{ ansible_facts.packages | default({}) }}"
  tags: [inventory_collect]

- name: "[inventory_collect] Serialize the facts document once (the exact bytes that get uploaded)"
  ansible.builtin.set_fact:
    inventory_collect_document_json: "{{ inventory_collect_document | to_json }}"
  tags: [inventory_collect]

- name: "[inventory_collect] Record integrity (sha256), size and package count"
  ansible.builtin.set_fact:
    inventory_collect_facts_sha256: "{{ inventory_collect_document_json | hash('sha256') }}"
    inventory_collect_facts_size_bytes: "{{ inventory_collect_document_json | length }}"
    inventory_collect_packages_count: "{{ ansible_facts.packages | default({}) | length }}"
  tags: [inventory_collect]

- name: "[inventory_collect] Publish the facts document to the presigned S3 URL (fail loud, but record why first)"
  tags: [inventory_collect, publish]
  block:
    - name: "[inventory_collect] PUT the facts document to the presigned URL (signed headers, no_log)"
      ansible.builtin.uri:
        url: "{{ inventory_collect_facts_s3_presigned_put_url }}"
        method: PUT
        body: "{{ inventory_collect_document_json }}"
        headers: "{{ inventory_collect_facts_s3_put_headers }}"
        status_code: [200]
        timeout: 120
      no_log: true
      delegate_to: localhost
      run_once: true

    - name: "[inventory_collect] Mark the collection as collected"
      ansible.builtin.set_fact:
        inventory_collect_status: collected
  rescue:
    - name: "[inventory_collect] Record the upload failure reason (fallback contract)"
      ansible.builtin.set_fact:
        inventory_collect_status: upload_failed
        inventory_collect_fail_reason: >-
          PUT of the facts document to the presigned S3 URL failed (HTTP
          error, expired/invalid signature, or a header mismatch against what
          was signed) — see the AAP job detail.

    - name: "[inventory_collect] Log the upload failure to set_stats before failing"
      ansible.builtin.set_stats:
        data:
          collect_status: "{{ inventory_collect_status }}"
          reason: "{{ inventory_collect_fail_reason }}"
          samurai_execution_id: "{{ samurai_execution_id | default('') }}"
          organization_id: "{{ inventory_collect_organization_id }}"
          target_host: "{{ inventory_collect_target_host }}"
          facts_sha256: "{{ inventory_collect_facts_sha256 | default('') }}"
        aggregate: false
        per_host: false

    - name: "[inventory_collect] Fail loud — the facts document IS the objective of the run"
      ansible.builtin.fail:
        msg: >-
          inventory_collect assembled the facts document
          (sha256={{ inventory_collect_facts_sha256 | default('?') }},
          {{ inventory_collect_facts_size_bytes | default('?') }} bytes) but could not
          publish it: {{ inventory_collect_fail_reason }}

- name: "[inventory_collect] Publish the collection contract to set_stats"
  ansible.builtin.set_stats:
    data:
      collect_status: "{{ inventory_collect_status }}"
      samurai_execution_id: "{{ samurai_execution_id | default('') }}"
      organization_id: "{{ inventory_collect_organization_id }}"
      target_host: "{{ inventory_collect_target_host }}"
      facts_sha256: "{{ inventory_collect_facts_sha256 }}"
      facts_size_bytes: "{{ inventory_collect_facts_size_bytes }}"
      packages_count: "{{ inventory_collect_packages_count }}"
      workload_root_signal: >-
        {{ 'apt_manual' if inventory_collect_manual_packages is defined else 'unavailable' }}
      workload_root_status: "{{ inventory_collect_manual_packages_status }}"
      workload_root_reason: "{{ inventory_collect_manual_packages_reason }}"
      workload_root_count: >-
        {{ (inventory_collect_manual_packages | length) if inventory_collect_manual_packages is defined else 0 }}
    aggregate: false
    per_host: false
  tags: [inventory_collect]
