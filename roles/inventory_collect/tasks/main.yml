---
# RFC-004 Camada 1 — read-only inventory collection. Machine A is never
# mutated by this role. The package map and workload evidence are observations
# only; downstream deterministic ETL owns interpretation.

- name: "[inventory_collect] Require the explicit dependency collection context"
  ansible.builtin.assert:
    that:
      - inventory_collect_schema == ('samurai.inventory_collect/v2' if (inventory_collect_dependency_observation_enabled | bool) else 'samurai.inventory_collect/v1')
      - not (inventory_collect_dependency_observation_enabled | bool) or (inventory_collect_dependency_request is mapping and inventory_collect_dependency_request | length > 0)
      - not (inventory_collect_dependency_observation_enabled | bool) or ((asset_id | default(0) | int) > 0 and (managed_server_id | default(0) | int) > 0 and (collection_run_id | default(0) | int) > 0)
      - not (inventory_collect_dependency_observation_enabled | bool) or ((ansible_facts.os_family | default('')) == 'Windows' or (ansible_facts.system | default('')) == 'Linux')
      - not (inventory_collect_dependency_observation_enabled | bool) or (inventory_collect_dependency_request.collector.platform == ('windows' if (ansible_facts.os_family | default('')) == 'Windows' else 'linux'))
    fail_msg: "Dependency observation requires an approved profile, explicit limits and tenant/Asset/server/run identity."
  tags: [inventory_collect, dependency_observation]

- name: "[inventory_collect] Display incoming payload (the presigned URL carries the signature, so only its presence is shown)"
  ansible.builtin.debug:
    msg:
      execution_id: "{{ samurai_execution_id | default('unknown') }}"
      organization_id: "{{ inventory_collect_organization_id }}"
      target_host: "{{ inventory_collect_target_host }}"
      facts_s3_presigned_put_url: >-
        {{ 'set' if (inventory_collect_facts_s3_presigned_put_url | length > 0) else 'MISSING' }}
      facts_s3_put_headers: "{{ inventory_collect_facts_s3_put_headers }}"
      schema: "{{ inventory_collect_schema }}"
  tags: [inventory_collect, debug]

- name: "[inventory_collect] Route the collection arm by platform family"
  # A forma EXPLÍCITA (`file:`) é obrigatória aqui: na forma livre o Ansible
  # quebra o valor nos espaços e tenta lê-lo como opções `chave=valor` — a
  # expressão condicional tem espaços, então TODA coleta morria no parser com
  # "Invalid options for ansible.builtin.include_tasks" (job AAP 171, STG).
  ansible.builtin.include_tasks:
    file: "collect_{{ 'windows' if (ansible_facts.os_family | default('')) == 'Windows' else 'linux' }}.yml"
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Collect dependency observations only when explicitly requested"
  ansible.builtin.include_tasks: collect_dependency.yml
  when: inventory_collect_dependency_observation_enabled | bool
  tags: [inventory_collect, dependency_observation]

- name: "[inventory_collect] Measure RHEL validation services only when explicitly bound"
  ansible.builtin.include_tasks: collect_rhel_service_function.yml
  when: rhel_service_observation_request is defined and rhel_service_observation_request | length > 0
  tags: [inventory_collect, collect, functional]

- name: "[inventory_collect] Publish the facts document (common to every arm)"
  ansible.builtin.include_tasks: publish.yml
  tags: [inventory_collect, collect]
