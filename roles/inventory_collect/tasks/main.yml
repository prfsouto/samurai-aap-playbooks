---
# RFC-004 Camada 1 — read-only inventory collection. Machine A is never
# mutated by this role. The package map and workload evidence are observations
# only; downstream deterministic ETL owns interpretation.

- name: "[inventory_collect] Display incoming payload (the presigned URL carries the signature, so only its presence is shown)"
  ansible.builtin.debug:
    msg:
      execution_id: "{{ samurai_execution_id | default('unknown') }}"
      organization_id: "{{ inventory_collect_organization_id }}"
      target_host: "{{ inventory_collect_target_host }}"
      facts_s3_presigned_put_url: >-
        {{ 'set' if (inventory_collect_facts_s3_presigned_put_url | length > 0) else 'MISSING' }}
      facts_s3_put_headers: "{{ inventory_collect_facts_s3_put_headers }}"
      schema: "{{ inventory_collect_schema }}"
  tags: [inventory_collect, debug]

- name: "[inventory_collect] Route the collection arm by platform family"
  # A forma EXPLÍCITA (`file:`) é obrigatória aqui: na forma livre o Ansible
  # quebra o valor nos espaços e tenta lê-lo como opções `chave=valor` — a
  # expressão condicional tem espaços, então TODA coleta morria no parser com
  # "Invalid options for ansible.builtin.include_tasks" (job AAP 171, STG).
  ansible.builtin.include_tasks:
    file: "collect_{{ 'windows' if (ansible_facts.os_family | default('')) == 'Windows' else 'linux' }}.yml"
  tags: [inventory_collect, collect]

- name: "[inventory_collect] Publish the facts document (common to every arm)"
  ansible.builtin.include_tasks: publish.yml
  tags: [inventory_collect, collect]
