---
# Corpo do estágio, incluído só quando há volume de dados configurado.
# A decisão de rodar ou não fica em main.yml.

- name: "[data_sync] Refuse offline_disk in the immutable rebuild"
  ansible.builtin.assert:
    that:
      - data_sync_mode == 'data_volume'
    fail_msg: >-
      data_sync_mode is '{{ data_sync_mode }}'. The rebuild only replicates DATA volumes:
      the system disk comes from the approved golden image, and overwriting it would
      destroy the very image this cycle just produced.
    quiet: true
  tags: [data_sync, guard]

# Estes três asserts são estáticos: não dependem de nada que o estágio produz. Rodam
# ANTES do include da nuvem para que uma misconfig aborte antes de existir volume
# efêmero — dado de cliente em repouso não nasce de uma configuração que já sabia
# que ia falhar.
- name: "[data_sync] Require destination and tenant"
  ansible.builtin.assert:
    that:
      - data_sync_destination | default('') | length > 0
      - organization_id is defined
      - organization_id | int > 0
    fail_msg: >-
      data_sync needs destination and organization_id. Multi-tenancy is enforced
      end to end (I9); an untenanted replication has no blast radius boundary.
    quiet: true
  tags: [data_sync, guard]

# O id nomeia o journal. Com um valor padrão, duas execuções diferentes disputariam o
# mesmo arquivo de estado, e uma retomaria pelo registro da outra.
- name: "[data_sync] Require the execution id from the control plane"
  ansible.builtin.assert:
    that:
      - samurai_execution_id is defined
      - samurai_execution_id | default('') | length > 0
      - samurai_execution_id | regex_search('^[A-Za-z0-9._-]+$') is not none
    quiet: true
  tags: [data_sync, guard]

# Meia identidade de cliente é pior que nenhuma: a conexão sobe sem mTLS e ninguém nota.
- name: "[data_sync] Require the mTLS pair to be complete or absent"
  ansible.builtin.assert:
    that:
      - (data_sync_tls_cert | length > 0) == (data_sync_tls_key | length > 0)
    fail_msg: >-
      data_sync_tls_cert and data_sync_tls_key must be given together. Passing only one
      silently drops client authentication.
    quiet: true
  tags: [data_sync, guard]

# Do attach do volume efêmero até o parse do resultado, TUDO vive neste block: qualquer
# falha — guard de montagem, preflight, morte do engine — passa pelo always e devolve
# o binário e o volume antes de o estágio declarar a falha. Sem isso, um preflight que
# recusa origem maior que destino abortava com cópia de dado de cliente anexada e viva.
- name: "[data_sync] Resolve, guard and replicate — cleaning up on any failure"
  block:
    # Snapshot informado: o Ansible resolve a origem num dispositivo antes de qualquer
    # validação de caminho, porque é ele quem passa a preencher `data_sync_source`.
    - name: "[data_sync] Resolve the source from a cloud snapshot"
      ansible.builtin.include_tasks: cloud_source.yml
      when: data_sync_source_snapshot | default('') | length > 0
      tags: [data_sync, cloud]

    - name: "[data_sync] Require a source"
      ansible.builtin.assert:
        that:
          - data_sync_source | default('') | length > 0
        fail_msg: >-
          data_sync needs a source: either data_sync_source or data_sync_source_snapshot.
        quiet: true
      tags: [data_sync, guard]

    - name: "[data_sync] Collect mount facts"
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "hardware"
      become: "{{ data_sync_become | bool }}"
      tags: [data_sync]

    # Escrever em bloco sob um filesystem montado corrompe o que estiver aberto nele.
    #
    # Comparar NOMES não cobre o problema. Casar `/dev/sdb` com `/dev/sdb1` por regex de
    # sufixo pega partição e mais nada: com LVM, o que está montado é `/dev/mapper/vg-lv`
    # (um `dm-N`); com LUKS, `/dev/mapper/cofre`; com mdraid, `/dev/md0`. Nenhum desses
    # nomes se parece com o do destino, e a escrita passaria por cima de dado vivo.
    #
    # O que decide é a ÁRVORE REAL: o `lsblk` lista o dispositivo e todos os que se apoiam
    # nele — partição, volume lógico, mapeamento cifrado, membro de RAID — com os pontos
    # de montagem. Qualquer nó montado nessa árvore bloqueia.
    #
    # Arquivo regular entra pela mesma porta: se estiver por trás de um loop device
    # montado, escrever no arquivo corrompe o filesystem que vive em cima dele.
    - name: "[data_sync] Walk the real block device tree under the destination"  # noqa: risky-shell-pipe
      ansible.builtin.shell: |
        set -eu
        dest={{ data_sync_destination | quote }}

        # Ainda não existe: nada pode se apoiar nele. O engine cria na primeira cópia.
        [ -e "$dest" ] || exit 0

        real=$(readlink -f "$dest") || exit 3

        targets=""
        if [ -b "$real" ]; then
          targets="$real"
        elif [ -f "$real" ]; then
          # `losetup -j` devolve os loop devices lastreados por este arquivo.
          targets=$(losetup -j "$real" 2>/dev/null | cut -d: -f1 || true)
        fi

        # A saída é capturada ANTES de ser lida. Encadear o `lsblk` direto num
        # `while` esconde a falha dele: a leitura sai vazia e o guard entende
        # "nada montado" — a resposta que autoriza escrever sobre dado vivo.
        for t in $targets; do
          arvore=$(lsblk --noheadings --raw --output NAME,TYPE,MOUNTPOINT "$t" 2>/dev/null) || exit 5
          printf '%s\n' "$arvore" | while read -r name type mnt rest; do
            if [ -n "${mnt:-}" ]; then
              printf '%s[%s] montado em %s\n' "$name" "$type" "$mnt"
            fi
          done
        done
      become: "{{ data_sync_become | bool }}"
      register: data_sync_blocking
      changed_when: false
      failed_when: false
      tags: [data_sync, guard]

    # Guard cego não escreve. rc=3 é o destino que existe e não resolve; rc=5 é o
    # `lsblk` que não conseguiu descrever a árvore. Os dois deixam a checagem sem
    # resposta, e sem resposta a etapa recusa.
    - name: "[data_sync] Refuse a destination whose device tree could not be read"
      ansible.builtin.assert:
        that:
          - data_sync_blocking.rc | default(1) == 0
        fail_msg: >-
          data_sync_destination '{{ data_sync_destination }}' could not be inspected
          (exit {{ data_sync_blocking.rc | default('desconhecido') }}). The mount guard
          walks the device tree from the resolved path; without that tree it cannot tell
          an empty disk from one with live filesystems on it, so the stage refuses
          instead of writing.
        quiet: true
      tags: [data_sync, guard]

    - name: "[data_sync] Refuse to write under anything mounted on that tree"
      ansible.builtin.assert:
        that:
          - data_sync_blocking.stdout_lines | default([]) | length == 0
        fail_msg: >-
          {{ data_sync_destination }} has live filesystems on its device tree:
          {{ data_sync_blocking.stdout_lines | default([]) | join('; ') }}.
          The engine writes at block level; doing that under a mounted filesystem —
          including one reached through LVM, dm-crypt, mdraid or a loop device —
          corrupts whatever is open on it.
        quiet: true
      tags: [data_sync, guard]

    - name: "[data_sync] Ensure the journal directory exists and survives the run"
      ansible.builtin.file:
        path: "{{ data_sync_journal_dir }}"
        state: directory
        owner: "{{ 'root' if data_sync_become | bool else omit }}"
        group: "{{ 'root' if data_sync_become | bool else omit }}"
        mode: "0700"
      become: "{{ data_sync_become | bool }}"
      tags: [data_sync]

    - name: "[data_sync] Stage the replication engine on the candidate"
      ansible.builtin.copy:
        src: "{{ data_sync_binary_src }}"
        dest: "{{ data_sync_binary_dest }}"
        mode: "0700"
        owner: "{{ 'root' if data_sync_become | bool else omit }}"
        group: "{{ 'root' if data_sync_become | bool else omit }}"
      become: "{{ data_sync_become | bool }}"
      tags: [data_sync]

    - name: "[data_sync] Build the argument list once"
      ansible.builtin.set_fact:
        data_sync_args: >-
          {{
            [
              '--source', data_sync_source,
              '--destination', data_sync_destination,
              '--execution-id', samurai_execution_id,
              '--organization-id', organization_id | string,
              '--journal-dir', data_sync_journal_dir,
              '--mode', data_sync_mode | replace('_', '-'),
              '--chunk-size', data_sync_chunk_size | string,
              '--in-flight', data_sync_in_flight | string,
              '--epoch-bytes', data_sync_epoch_bytes | string,
              '--epoch-max-age-ms', data_sync_epoch_max_age_ms | string
            ]
            + (['--tls-ca', data_sync_tls_ca] if data_sync_tls_ca | length > 0 else [])
            + (['--tls-server-name', data_sync_tls_server_name] if data_sync_tls_server_name | length > 0 else [])
            + (['--tls-cert', data_sync_tls_cert, '--tls-key', data_sync_tls_key] if data_sync_tls_cert | length > 0 else [])
          }}
      tags: [data_sync]

    - name: "[data_sync] Preflight — sizes, alignment and capabilities, without writing"
      ansible.builtin.command:
        argv: "{{ [data_sync_binary_dest, 'preflight'] + data_sync_args }}"
      become: "{{ data_sync_become | bool }}"
      register: data_sync_preflight
      changed_when: false
      tags: [data_sync]

    - name: "[data_sync] Replicate"
      ansible.builtin.command:
        argv: "{{ [data_sync_binary_dest, 'copy'] + data_sync_args }}"
      become: "{{ data_sync_become | bool }}"
      register: data_sync_run
      changed_when: data_sync_run.rc == 0
      async: "{{ data_sync_timeout_seconds }}"
      poll: 15
      tags: [data_sync]

    - name: "[data_sync] Parse the engine result"
      ansible.builtin.set_fact:
        data_sync_result: "{{ data_sync_run.stdout | from_json }}"
      tags: [data_sync]

    # A cópia diz o que ESCREVEU. A verificação relê os dois lados e diz o que
    # cada dispositivo CONTÉM — são passagens diferentes sobre mídias
    # diferentes, e é essa diferença que pega um erro de escrita. Quem compara
    # os dois resumos é o control plane; aqui só se mede.
    - name: "[data_sync] Read both sides back and publish each digest"
      ansible.builtin.command:
        argv: "{{ [data_sync_binary_dest, 'verify'] + data_sync_args }}"
      become: "{{ data_sync_become | bool }}"
      register: data_sync_verify_run
      changed_when: false
      async: "{{ data_sync_timeout_seconds }}"
      poll: 15
      when: data_sync_verify_enabled | bool
      tags: [data_sync]

    - name: "[data_sync] Parse the verification result"
      ansible.builtin.set_fact:
        data_sync_verify: "{{ data_sync_verify_run.stdout | from_json }}"
        # O instante em que a MEDIDA foi tomada. O control plane compara a
        # evidência com o nascimento do candidato; a hora da ingestão não
        # responde quando o disco foi lido.
        data_sync_verify_measured_at: "{{ ansible_date_time.iso8601 | default('') }}"
      when:
        - data_sync_verify_enabled | bool
        - data_sync_verify_run.stdout | default('') | length > 0
      tags: [data_sync]

    # O estágio MEDE e publica; quem julga continuidade é o gate, do lado do
    # control plane. Aqui só se recusa seguir quando a MEDIÇÃO não aconteceu ou
    # não é comparável — montar o filesystem sem medida nenhuma esconderia o
    # problema em vez de reportá-lo.
    - name: "[data_sync] Refuse to continue when the two sides were not measured comparably"
      ansible.builtin.assert:
        that:
          - data_sync_verify is defined
          - data_sync_verify.comparable | default(false) | bool
          - (data_sync_verify.source_digest | default('')) | length > 0
          - (data_sync_verify.destination_digest | default('')) | length > 0
        fail_msg: >-
          the two sides were not measured over the same range, so there is nothing
          to compare: source range
          {{ data_sync_verify.source_verified_bytes | default('?') }},
          destination range
          {{ data_sync_verify.destination_verified_bytes | default('?') }}.
          The gate decides continuity from the published digests, not from here.
        quiet: true
      when: data_sync_verify_enabled | bool
      tags: [data_sync, guard]

  always:
    # As duas limpezas são INDEPENDENTES de propósito. Num `always` sequencial, a falha da
    # primeira aborta a lista e a segunda nunca roda — e a segunda é justamente a que
    # destrói um volume com cópia de dado de cliente em repouso. Um binário que não pôde
    # ser apagado não pode decidir que o volume fica.
    - name: "[data_sync] Remove the staged binary"
      ansible.builtin.file:
        path: "{{ data_sync_binary_dest }}"
        state: absent
      become: "{{ data_sync_become | bool }}"
      when: data_sync_remove_binary | bool
      register: data_sync_binary_cleanup
      failed_when: false
      tags: [data_sync]

    # Ordem inversa à criação: o volume efêmero sai antes de o estágio terminar — também
    # quando algo falha. Ele carrega cópia de dado de cliente em repouso, e deixá-lo
    # para trás seria o oposto de efêmero.
    #
    # O `rescue` existe para que uma falha AQUI ainda passe pela declaração de resíduo
    # abaixo: sobra não declarada é pior que sobra conhecida.
    - name: "[data_sync] Destroy the ephemeral cloud volume"
      block:
        - name: "[data_sync] Run the cloud cleanup"
          ansible.builtin.include_tasks: cloud_cleanup.yml
          when: data_sync_cloud_volume_id | default('') | length > 0
      rescue:
        - name: "[data_sync] Cloud cleanup failed — keep the residue visible"
          ansible.builtin.set_fact:
            data_sync_cloud_residue: "{{ [data_sync_cloud_volume_id] }}"
            data_sync_cloud_residue_reason: "limpeza da nuvem falhou antes de confirmar a remoção"
            data_sync_cleanup_failed: true
      tags: [data_sync, cloud]

    # Declaração incondicional: roda no sucesso e no fracasso, e é o único lugar em que o
    # operador descobre o que ficou para trás. Publicada por `set_stats` para o workflow
    # poder agir (RFC-004 §0.1.1, classe efêmera).
    - name: "[data_sync] Declare every residue the cleanup left behind"
      ansible.builtin.set_stats:
        data:
          data_sync_residues: >-
            {{
              (
                ['binário em ' ~ data_sync_binary_dest]
                if (data_sync_binary_cleanup.failed | default(false))
                else []
              )
              + (
                (data_sync_cloud_residue | default([]))
                | map('regex_replace', '^', 'volume efêmero ')
                | list
              )
            }}
          data_sync_residue_reason: "{{ data_sync_cloud_residue_reason | default('') }}"
      tags: [data_sync]

    - name: "[data_sync] Say out loud what survived the cleanup"
      ansible.builtin.debug:
        msg: >-
          RESÍDUO: {{ ((['binário em ' ~ data_sync_binary_dest]
          if (data_sync_binary_cleanup.failed | default(false)) else [])
          + (data_sync_cloud_residue | default([]))) | join('; ') }}
          — {{ data_sync_cloud_residue_reason | default('sem motivo registrado') }}
      when: >-
        (data_sync_binary_cleanup.failed | default(false))
        or (data_sync_cloud_residue | default([]) | length > 0)
      tags: [data_sync]

# Mesmo contrato de saída dos demais estágios do workflow (RFC-004 §16.3): quem lê os
# artefatos do run não precisa aprender um canal novo.
- name: "[data_sync] Publish results for the workflow"
  ansible.builtin.set_stats:
    data:
      data_sync_done: true
      bytes_copied: "{{ data_sync_result.bytes_copied }}"
      bytes_skipped_sparse: "{{ data_sync_result.bytes_skipped_sparse }}"
      sparse_method: "{{ data_sync_result.sparse_method }}"
      epochs_total: "{{ data_sync_result.epochs_total }}"
      epochs_resumed: "{{ data_sync_result.epochs_resumed }}"
      manifest_root_blake3: "{{ data_sync_result.manifest_root_blake3 }}"
      data_sync_completed_at: "{{ ansible_date_time.iso8601 | default('') }}"
  tags: [data_sync]
