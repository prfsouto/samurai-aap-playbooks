---
# ============================================================================
# Role: data_sync
# Purpose: replicate the old server's DATA volumes onto the candidate's freshly
# attached (and still unmounted) devices, using the samurai-replicate engine.
#
# Runs between `provision` and `bootstrap`: the target devices have no filesystem
# in use yet, so the engine writes to them without anything mounted on top.
#
# I10 is preserved because the AAP is the one executing — the engine is the tool it
# wields, the same way Terraform runs inside the `provision` role.
# ============================================================================

# O estágio entra no workflow do rebuild, que hoje atende servidor sem estado local.
# Sem itens, sem origem E sem destino, não há volume de dados a replicar: o passo é
# inerte e o ciclo segue igual ao que já rodava. Só um dos dois preenchido é
# configuração incoerente, e aí falha — o silêncio ali esconderia um volume que
# deveria ter sido copiado.
- name: "[data_sync] Decide whether there is anything to replicate"
  ansible.builtin.set_fact:
    data_sync_requested: >-
      {{ (data_sync_items | default([]) | length > 0)
         or (data_sync_source | default('') | length > 0)
         or (data_sync_destination | default('') | length > 0)
         or (data_sync_source_snapshot | default('') | length > 0) }}
  tags: [data_sync]

- name: "[data_sync] Nothing configured — the stage is a no-op for this rebuild"
  ansible.builtin.set_stats:
    data:
      data_sync_done: false
      data_sync_skipped: true
      data_sync_skip_reason: "no data volume configured for this rebuild"
  when: not (data_sync_requested | bool)
  tags: [data_sync]

# Um par por execução do motor. Com vários volumes, quem itera é o estágio: o
# motor continua fazendo origem→destino, e cada volume ganha identidade própria
# de execução (etapa e geração incluídas) para não disputar o mesmo journal.
- name: "[data_sync] Replicate each planned volume, one at a time"
  ansible.builtin.include_tasks: replicate_item.yml
  loop: "{{ data_sync_items | default([]) }}"
  loop_control:
    loop_var: data_sync_item
    label: "{{ data_sync_item.mount_point | default(data_sync_item.source_volume_stable_id) }}"
  when:
    - data_sync_requested | bool
    - data_sync_items | default([]) | length > 0
  tags: [data_sync]

# Caminho de um par só, preservado byte a byte para quem já chamava o estágio
# com as variáveis escalares.
- name: "[data_sync] Replicate the single configured data volume"
  ansible.builtin.include_tasks: replicate.yml
  when:
    - data_sync_requested | bool
    - data_sync_items | default([]) | length == 0
  tags: [data_sync]

- name: "[data_sync] Publish the aggregate result of the stage"
  ansible.builtin.set_stats:
    data:
      data_sync_done: true
      data_sync_volumes_total: "{{ data_sync_items | default([]) | length }}"
  when:
    - data_sync_requested | bool
    - data_sync_items | default([]) | length > 0
  tags: [data_sync]
