---
# ============================================================================
# Resolução da origem na nuvem: snapshot → volume efêmero → dispositivo no candidato.
#
# Quem fala com a API do provider é o Ansible, com a credencial que o AAP já injeta no
# Job Template (o mesmo `samurai_aws_credential` que o role `provision` usa). O binário
# recebe um caminho de dispositivo e não conhece nuvem nenhuma — é o que mantém o núcleo
# sem SDK e a credencial fora do processo que escreve em bloco.
#
# O volume criado aqui é efêmero: nasce nesta operação, é etiquetado, e o cleanup o
# destrói. Ele não sobrevive ao estágio.
# ============================================================================

- name: "[data_sync] Read the snapshot and its tags"
  amazon.aws.ec2_snapshot_info:
    snapshot_ids:
      - "{{ data_sync_source_snapshot }}"
    region: "{{ data_sync_cloud_region }}"
  delegate_to: localhost
  register: data_sync_snapshot_info
  tags: [data_sync, cloud]

- name: "[data_sync] Refuse a snapshot that does not exist"
  ansible.builtin.assert:
    that:
      - data_sync_snapshot_info.snapshots | length == 1
    fail_msg: "snapshot {{ data_sync_source_snapshot }} not found in {{ data_sync_cloud_region }}."
    quiet: true
  tags: [data_sync, cloud, guard]

# Multi-tenancy (I9) conferida contra o provider, não contra o que o chamador afirmou.
# Sem isto, quem controlasse o payload poderia apontar o snapshot de uma organização para
# o servidor de outra — o vetor de confused deputy que o plano §7.1 nomeia.
- name: "[data_sync] Verify the snapshot belongs to this organization"
  ansible.builtin.assert:
    that:
      - _snap_org | length > 0
      - _snap_org == (organization_id | string)
    fail_msg: >-
      snapshot {{ data_sync_source_snapshot }} carries organization_id
      '{{ _snap_org | default("<absent>") }}' but this job runs for '{{ organization_id }}'.
      Cross-tenant replication is refused.
    quiet: true
  vars:
    _snap_org: "{{ data_sync_snapshot_info.snapshots[0].tags[data_sync_org_tag] | default('') | string }}"
  tags: [data_sync, cloud, guard]

- name: "[data_sync] Verify the snapshot is managed by the platform"
  ansible.builtin.assert:
    that:
      - data_sync_snapshot_info.snapshots[0].tags['managed_by'] | default('') == 'samurai-shield'
    fail_msg: >-
      snapshot {{ data_sync_source_snapshot }} is not tagged managed_by=samurai-shield.
      The engine only replicates from artefacts the platform produced.
    quiet: true
  when: data_sync_require_managed_tag | bool
  tags: [data_sync, cloud, guard]

- name: "[data_sync] Require the platform KMS key for the ephemeral volume"
  ansible.builtin.assert:
    that:
      - data_sync_cloud_kms_key_id | default('') | trim | length > 0
    fail_msg: >-
      data_sync_cloud_kms_key_id is empty. The ephemeral volume holds a copy of customer
      data at rest and must be encrypted under the platform key — the account default is
      the same posture the platform already rejects for evidence and state artifacts.
    quiet: true
  tags: [data_sync, cloud, guard]

- name: "[data_sync] Create an ephemeral volume from the snapshot"
  amazon.aws.ec2_vol:
    snapshot: "{{ data_sync_source_snapshot }}"
    zone: "{{ data_sync_cloud_zone }}"
    region: "{{ data_sync_cloud_region }}"
    volume_type: "{{ data_sync_cloud_volume_type }}"
    encrypted: true
    kms_key_id: "{{ data_sync_cloud_kms_key_id | trim }}"
    tags:
      Name: "samurai-data-sync-{{ samurai_execution_id }}"
      managed_by: samurai-shield
      samurai_execution_id: "{{ samurai_execution_id }}"
      "{{ data_sync_org_tag }}": "{{ organization_id | string }}"
      ephemeral: "true"
    state: present
  delegate_to: localhost
  register: data_sync_cloud_volume
  tags: [data_sync, cloud]

# O id nasce AQUI, nao no fim do include: falha no attach ou no wait_for abaixo
# ainda encontra o always do replicate.yml com a fact preenchida e destroi o
# volume — copia de dado de cliente nao fica orfa por uma falha de anexacao.
- name: "[data_sync] Remember the ephemeral volume id for cleanup"
  ansible.builtin.set_fact:
    data_sync_cloud_volume_id: "{{ data_sync_cloud_volume.volume_id }}"
  tags: [data_sync, cloud]

- name: "[data_sync] Attach it to the candidate, read-only for the engine"
  amazon.aws.ec2_vol:
    id: "{{ data_sync_cloud_volume.volume_id }}"
    instance: "{{ instance_id }}"
    device_name: "{{ data_sync_cloud_attach_device }}"
    region: "{{ data_sync_cloud_region }}"
    state: present
  delegate_to: localhost
  register: data_sync_cloud_attach
  tags: [data_sync, cloud]

# O nome pedido no anexo NÃO é o caminho dentro da máquina. Em instância Nitro o
# kernel enumera /dev/nvme<N>n1 e ignora o device_name do mapeamento; o
# identificador estável que existe DENTRO da instância é o volume id no serial
# NVMe. Esperar por um caminho que nunca vai aparecer queima o tempo limite, e
# um vínculo antigo com aquele nome aponta para OUTRO disco — o motor leria o
# disco errado.
- name: "[data_sync] Wait until a device carrying this volume id shows up"
  ansible.builtin.shell: |
    set -eu
    want=$(printf '%s' "{{ data_sync_cloud_volume_id }}" | tr -d '-' | tr '[:upper:]' '[:lower:]')
    deadline=$(( $(date +%s) + {{ data_sync_cloud_attach_timeout | int }} ))

    resolve() {
      lsblk --nodeps --noheadings --output NAME,SERIAL 2>/dev/null | while read -r name serial rest; do
        [ -n "${serial:-}" ] || continue
        s=$(printf '%s' "$serial" | tr -d '-' | tr '[:upper:]' '[:lower:]')
        if [ "$s" = "$want" ]; then
          printf '/dev/%s\n' "$name"
          return 0
        fi
      done
      return 1
    }

    while [ "$(date +%s)" -lt "$deadline" ]; do
      found=$(resolve || true)
      if [ -n "${found:-}" ]; then
        printf '%s\n' "$found"
        exit 0
      fi
      # Sem serial (geração Xen), o caminho do anexo é o que existe de fato.
      if [ -b "{{ data_sync_cloud_attach_device }}" ]; then
        printf '%s\n' "{{ data_sync_cloud_attach_device }}"
        exit 0
      fi
      sleep 5
    done
    exit 4
  args:
    executable: /bin/sh
  become: "{{ data_sync_become | bool }}"
  register: data_sync_device_resolution
  changed_when: false
  failed_when: false
  tags: [data_sync, cloud]

- name: "[data_sync] Refuse to replicate from a device we could not identify"
  ansible.builtin.assert:
    that:
      - data_sync_device_resolution.rc == 0
      - data_sync_device_resolution.stdout | trim | length > 0
    fail_msg: >-
      volume {{ data_sync_cloud_volume_id }} was attached but no block device on this
      host carries its id in the NVMe serial, and {{ data_sync_cloud_attach_device }}
      does not exist either. Replicating from a device chosen by name would risk
      reading the wrong disk, so the stage refuses.
    quiet: true
  tags: [data_sync, cloud, guard]

- name: "[data_sync] Point the engine at the device that carries this volume id"
  ansible.builtin.set_fact:
    data_sync_source: "{{ data_sync_device_resolution.stdout | trim }}"
    data_sync_cloud_volume_id: "{{ data_sync_cloud_volume.volume_id }}"
    data_sync_source_device_resolved_by: >-
      {{ 'nvme_serial' if (data_sync_device_resolution.stdout | trim) != data_sync_cloud_attach_device
         else 'attachment_name' }}
  tags: [data_sync, cloud]
