---
# Um volume do plano. Recebe o item, aponta as variáveis do estágio para ele e
# reusa o corpo de replicação — o motor segue fazendo um par por execução.

# O destino nasce no estágio de provisionamento, dentro deste mesmo run: o
# control plane despacha a INTENÇÃO e o provisionamento devolve o id do volume.
# A junção é pelo volume de ORIGEM, a chave que os dois lados conhecem. O item já
# trazer o destino é o caso da retomada, quando o volume veio de outra tentativa.
- name: "[data_sync] Take the destination provisioning created for this item"
  ansible.builtin.set_fact:
    data_sync_item_destination_volume: >-
      {{ (data_sync_destination_bindings | default([])
          | selectattr('source_volume_stable_id', 'equalto',
                       data_sync_item.source_volume_stable_id)
          | map(attribute='destination_volume_stable_id') | list
          | first)
         | default(data_sync_item.destination_volume_stable_id | default(''), true) }}
  tags: [data_sync]

- name: "[data_sync] Require the item to carry its own execution identity"
  ansible.builtin.assert:
    that:
      - data_sync_item.replication_execution_id | default('') | length > 0
      - data_sync_item.source_volume_stable_id | default('') | length > 0
      - data_sync_item_destination_volume | default('') | length > 0
      - not (samurai_engine_callback_auth | default(false) | bool) or data_sync_item.source_transport | default('') in ['cloud-volume', 'snapshot-export']
    fail_msg: >-
      each data_sync item needs replication_execution_id, source_volume_stable_id and
      destination_volume_stable_id. The execution id names the engine's journal:
      reusing one across volumes or stages makes a resume pick up another copy's
      record. The destination travels as the PROVIDER volume id — a device path
      is a dated observation and names a different disk after the next reboot.
    quiet: true
  tags: [data_sync, guard]

- name: "[data_sync] Observe current destination identity before opening it"
  samurai_destination_observation:
    organization_id: "{{ organization_id | int }}"
    provider: "{{ samurai_destination_provider }}"
  become: "{{ data_sync_become | bool }}"
  register: data_sync_current_devices
  tags: [data_sync, guard]

- name: "[data_sync] Resolve the destination through its provider evidence"
  ansible.builtin.set_fact:
    campaign_destination_observation: "{{ data_sync_current_devices.observation }}"
    data_sync_resolved_device: >-
      {{ data_sync_item_destination_volume | samurai_destination_observed_device(
         data_sync_current_devices.observation, samurai_destination_provider,
         data_sync_destination_bindings | default([])) }}
  tags: [data_sync, guard]

- name: "[data_sync] Require an unmounted destination before seed"
  ansible.builtin.set_fact:
    data_sync_resolved_device: "{{ data_sync_resolved_device | samurai_require_unmounted }}"
  when: data_sync_item.stage | default('seed') != 'final'
  tags: [data_sync, guard]

- name: "[data_sync] Point the stage at this item"
  ansible.builtin.set_fact:
    data_sync_execution_id: "{{ data_sync_item.replication_execution_id }}"
    data_sync_source: "{{ data_sync_item.source | default('') }}"
    data_sync_source_snapshot: "{{ data_sync_item.source_snapshot | default('') }}"
    data_sync_source_transport: "{{ data_sync_item.source_transport | default('cloud-volume') }}"
    data_sync_snapshot_directory: {}
    data_sync_snapshot_response: {}
    data_sync_snapshot_close: {}
    data_sync_destination: "{{ data_sync_resolved_device.name }}"
    data_sync_destination_serial: "{{ data_sync_resolved_device.serial | default('', true) }}"
    data_sync_destination_volume_id: "{{ data_sync_item_destination_volume }}"
    data_sync_cloud_volume_id: ""
    data_sync_volume_check: {}
    data_sync_cloud_residue: []
    data_sync_cloud_residue_reason: ""
    data_sync_cleanup_failed: false
    data_sync_item_stage: "{{ data_sync_item.stage | default('seed') }}"
    data_sync_item_volume_id: "{{ data_sync_item.source_volume_stable_id }}"
  tags: [data_sync]

- name: "[data_sync] Prepare the destination for final delta"
  ansible.builtin.include_tasks: final_delta_destination.yml
  when: data_sync_item_stage == 'final'
  tags: [data_sync, guard]

- name: "[data_sync] Replicate this volume"
  ansible.builtin.include_tasks: replicate.yml
  tags: [data_sync]

# Evidência POR ITEM, publicada assim que o volume termina. Publicar só no fim do
# laço perderia tudo que já concluiu se o executor morresse no meio — e a
# reconciliação não saberia por onde retomar.
- name: "[data_sync] Publish this volume's own result"
  register: campaign_volume_publication
  ansible.builtin.set_stats:
    aggregate: true
    data:
      data_sync_destination_bindings:
        - replication_execution_id: "{{ data_sync_execution_id }}"
          source_volume_stable_id: "{{ data_sync_item_volume_id }}"
          destination_volume_stable_id: "{{ data_sync_destination_volume_id }}"
          device_path_observed: "{{ data_sync_destination }}"
          os_serial_observed: "{{ data_sync_destination_serial }}"
      data_sync_volume_results:
        - replication_execution_id: "{{ data_sync_execution_id }}"
          source_volume_stable_id: "{{ data_sync_item_volume_id }}"
          stage: "{{ data_sync_item_stage }}"
          succeeded: "{{ (data_sync_result is defined) and (data_sync_result.bytes_copied is defined) }}"
          bytes_copied: "{{ data_sync_result.bytes_copied | default(0) }}"
          bytes_skipped_sparse: "{{ data_sync_result.bytes_skipped_sparse | default(0) }}"
          manifest_root_blake3: "{{ data_sync_result.manifest_root_blake3 | default('') }}"
          source_digest: "{{ (data_sync_verify | default({})).source_digest | default('') }}"
          source_digest_algorithm: "{{ (data_sync_verify | default({})).algorithm | default('') }}"
          source_digest_measured_at: "{{ data_sync_verify_measured_at | default('') }}"
          destination_digest: "{{ (data_sync_verify | default({})).destination_digest | default('') }}"
          destination_digest_algorithm: "{{ (data_sync_verify | default({})).algorithm | default('') }}"
          destination_digest_measured_at: "{{ data_sync_verify_measured_at | default('') }}"
          source_verified_bytes: "{{ (data_sync_verify | default({})).source_verified_bytes | default(0) }}"
          destination_verified_bytes: "{{ (data_sync_verify | default({})).destination_verified_bytes | default(0) }}"
          destination_device_size: "{{ (data_sync_verify | default({})).destination_device_size | default(0) }}"
          destination_device: "{{ data_sync_destination }}"
          completed_at: "{{ ansible_date_time.iso8601 | default('') }}"
  tags: [data_sync]

- name: "[data_sync] Retain observed results for the current campaign member"
  ansible.builtin.set_fact:
    campaign_data_sync_volume_results: >-
      {{ campaign_data_sync_volume_results | default([])
         + campaign_volume_publication.ansible_stats.data.data_sync_volume_results }}
  when: samurai_engine_callback_auth | default(false) | bool
  tags: [data_sync]
