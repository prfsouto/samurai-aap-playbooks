---
- name: "[cloud_executor_k8s] Exigir referência de Secret já cadastrada"
  ansible.builtin.assert:
    that:
      - aws_credential_ref | default('') | trim | length > 0
      - aws_access_key_id is not defined
      - aws_secret_access_key is not defined
    fail_msg: >-
      Cloud Executor exige uma referência de Secret já cadastrada; valores de
      acesso não são aceitos em extra_vars.
