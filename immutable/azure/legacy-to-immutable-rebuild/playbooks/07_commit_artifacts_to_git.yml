---
# Existing AAP Job Templates reference this path.
- name: "SamurAI :: legacy-to-immutable :: Git artifact publication disabled"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record that evidence publication is disabled
      ansible.builtin.set_stats:
        data:
          samurai_git_committed: false
          samurai_evidence_publication: disabled
